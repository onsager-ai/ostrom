[package]
name = "ostrom-cli"
description = "Ostrom command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ostrom"
path = "src/main.rs"

[dependencies]
clap.workspace = true
chrono.workspace = true
directories.workspace = true
ostrom-core = { path = "../ostrom-core" }
ostrom-checks = { path = "../ostrom-checks" }
ostrom-store = { path = "../ostrom-store" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Signals are a POSIX mechanism; signal-hook configures its constants out on
# Windows rather than stubbing them, so the dependency itself is unix-only.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
