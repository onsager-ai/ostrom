# reads as a decision rather than an oversight. Nothing here names a file in
# this directory -- do not go looking for one.
present = false
withheld_because = "chreode's codex normaliser is known broken; its output over this capture is wrong in four separate ways and must not enter a conformance corpus."
why_broken = """
It asserts synthesised toolUseIds (codex-cmd-1, codex-cmd-2, codex-cmd-4,
codex-edit-3) where the real ids in this very capture are item_1, item_3,
item_5, item_7. It carries two spurious agent.warning frames for turn.started.
It manufactures four tool_use/tool_result pairs from completed items alone,
discarding the real item.started events. And it emits ZERO agent.text, because
chreode matches assistant_message/message while codex emits agent_message.

Adopting it would bake into a conformance corpus exactly the guesses this
capture was run to retire. Per ethogram#4, a fixture that guesses is withdrawn
rather than corrected. Blocked on chreode#474.
"""

[notes.accumulation]
# Flagged by umwelt-bd: the `not_exercised` list above turned out to be
# load-bearing rather than bookkeeping.
why_multiple_turns_matters = """
ethogram's accumulation ruling (#6, 2026-09-07) states its own precondition:
it assumes every harness reports SESSION-CUMULATIVE cost on its result frames,
and is "invalid for a harness that reports per-frame increments, whose
normaliser must accumulate before emitting so the wire stays cumulative."

This capture contains exactly ONE turn.started and ONE turn.completed. With a
single turn, a cumulative total and a per-turn increment are numerically
identical, so this capture CANNOT distinguish them. A codex normaliser
therefore cannot yet know whether it must accumulate before emitting.

Settling it needs a capture with at least two turns. Recorded as a known gap
rather than resolved by assumption.
"""
