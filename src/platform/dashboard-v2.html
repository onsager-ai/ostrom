<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ostrom Preview</title>
<style>
:root {
  color-scheme: light dark;
  --canvas: light-dark(#f8f8fa, #09090b);
  --surface: light-dark(#fff, #111114);
  --raised: light-dark(#f0f0f4, #18181c);
  --line: light-dark(#e3e3ea, #ffffff14);
  --line-strong: light-dark(#d2d2de, #ffffff24);
  --ink: light-dark(#19191e, #f4f4f5);
  --muted: light-dark(#585866, #b0b0ba);
  --accent: light-dark(#4f46e5, #818cf8);
  --accent-text: light-dark(#4338ca, #c3c8ff);
  --tint: light-dark(#eeedff, #22233d);
  --accent-line: light-dark(#cbc7ff, #393c63);
  --green: light-dark(#087452, #34d399);
  --amber: light-dark(#845400, #fbbf24);
  --red: light-dark(#b52836, #f87171);
  --shadow: light-dark(#2020320a, #0003);
  --mono: ui-monospace, "SF Mono", monospace;
  font: 15px/1.45 Inter, system-ui, sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased }
a { color: inherit; text-decoration: none }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3, p, dl, dd { margin: 0 }
h1, h2, h3 { line-height: 1.2; letter-spacing: -.025em; font-weight: 650 }
h1 { font-size: 30px }
h2 { font-size: 17px }
h3 { font-size: 16px }
small, .micro { font-size: 13px }
.mono, time { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.accent { color: var(--accent-text) }
.good { color: var(--green) }
.warn { color: var(--amber) }
.bad { color: var(--red) }
.icon { width: 17px; height: 17px; flex: none; vertical-align: middle }
.dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: currentColor }
.lineup, .brand, .tag, .card-head { display: flex; align-items: center; gap: 8px; min-width: 0 }
.tag { display: inline-flex; padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); font-size: 13px; font-weight: 550; max-width: 100% }
.tag.accent { background: var(--tint); border-color: var(--accent-line) }
.shell { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: 48px 1fr auto }
.app-header {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
  gap: 8px; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
  border-bottom: 1px solid var(--line); background: var(--canvas);
}
.brand { font-size: 17px; font-weight: 700; letter-spacing: -.025em; min-height: 44px }
.brand-mark, .card-icon {
  width: 26px; height: 26px; flex: none; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 7px; background: var(--raised); color: var(--muted);
}
.brand-mark { background: var(--tint); color: var(--accent); border-color: var(--accent-line) }
.header-meta { gap: 6px; font-size: 13px }
.rail { display: none }
.tabbar {
  position: sticky; bottom: 0; z-index: 2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 4px max(6px, env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
  border-top: 1px solid var(--line); background: var(--surface);
}
.tabbar a {
  display: grid; place-content: center; justify-items: center; position: relative; min-height: 50px;
  gap: 2px; border-radius: 8px; font-size: 13px; color: var(--muted);
}
.tabbar a[aria-current="page"], .rail a[aria-current="page"] { background: var(--tint); color: var(--accent-text); font-weight: 650 }
.tab-icon { position: relative; display: flex }
.tabbar .nav-count {
  position: absolute; left: 15px; top: -6px; padding-inline: 4px; border-radius: 10px; min-width: 18px;
  text-align: center; background: var(--tint); border: 1px solid var(--accent-line); color: var(--accent-text); line-height: 16px;
}
main { width: min(100%, 728px); min-width: 0; margin-inline: auto; padding: 16px 12px 20px; overflow-wrap: anywhere }
.view, .stack { display: grid; gap: 12px; min-width: 0 }
.hero { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 8px }
.hero p { margin-top: 4px }
.banner { border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; background: var(--raised); color: var(--amber) }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.tile, .card { min-width: 0; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 24px var(--shadow) }
.tile { padding: 9px 8px; border-radius: 10px; display: grid; align-content: start; gap: 5px }
.tile strong { line-height: 1.2; font-size: 19px; letter-spacing: -.025em }
.tile-label { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 650 }
.tile-label .icon { width: 14px; height: 14px }
.tile p {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  line-height: 1.3; color: var(--muted);
}
.tile.callout { border-color: var(--accent-line); background: linear-gradient(145deg, var(--tint), var(--surface)) }
.tile.callout:hover { border-color: var(--accent) }
.grid { display: grid; gap: 12px; align-items: start; grid-template-columns: minmax(0, 1fr) }
.card { border-radius: 12px }
.card-head { padding: 12px; border-bottom: 1px solid var(--line) }
.card-head h2 { flex: 1 }
.card-body { padding: 12px }
.card-foot { border-top: 1px solid var(--line); padding: 9px 12px; color: var(--muted) }
.matrix-row {
  display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(30px, .9fr) minmax(46px, .58fr) minmax(48px, .6fr);
  align-items: center; gap: 6px; min-height: 42px; padding: 5px 10px; border-bottom: 1px solid var(--line);
}
.matrix-row:last-child { border-bottom: 0 }
.matrix-head { min-height: 32px; background: var(--raised); color: var(--muted); font-size: 13px }
.matrix-row .lineup { gap: 5px; font-weight: 600 }
.matrix-row .icon { width: 15px; height: 15px }
.matrix-row .mono { font-size: 13px }
.goal-status { display: block; font-size: 13px; font-weight: 500 }
.meter, .fleet-bar { display: flex; height: 7px; overflow: hidden; border-radius: 8px; background: var(--raised) }
.meter > span { background: var(--accent); width: var(--fill) }
.meter.warn > span { background: var(--amber) }
.meter.good > span { background: var(--green) }
.inline-button, .filterbar button { min-height: 44px; border-radius: 7px; font-weight: 600 }
.inline-button { width: 100%; border: 0; padding: 6px 12px; text-align: left; background: transparent; color: var(--accent-text) }
.inline-button:hover { background: var(--raised) }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.metrics div + div { border-left: 1px solid var(--line); padding-left: 8px }
.metrics dt { font-size: 13px; color: var(--muted) }
.metrics dd { margin-top: 4px; font-weight: 650; letter-spacing: -.025em }
.budget { padding-top: 10px; border-top: 1px solid var(--line) }
.budget .meter { margin-top: 6px }
.fleet-bar > span { flex: var(--count); background: currentColor; min-width: 0 }
.fleet-bar > span + span { border-left: 2px solid var(--surface) }
.fleet-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px }
.fleet-legend .lineup { gap: 4px }
.rows { list-style: none; padding: 0; margin: 0 }
.rows li { border-top: 1px solid var(--line); padding: 9px 0 }
.rows li:last-child { padding-bottom: 0 }
.run-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px }
.run-row .lineup { flex-wrap: wrap; gap: 4px 7px }
.run-row strong { display: block }
.model { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted) }
.model .icon { width: 15px; height: 15px }
.chart { display: block; width: 100%; height: auto; overflow: visible }
.chart rect { fill: var(--accent); opacity: .7 }
.chart circle { fill: var(--green); stroke: var(--surface); stroke-width: 1.5 }
.chart line { stroke: var(--line-strong); stroke-width: 1; vector-effect: non-scaling-stroke }
.chart-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-top: 2px; font-size: 13px; color: var(--muted) }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px }
.key { width: 8px; height: 8px; border-radius: 2px; background: var(--accent) }
.extras { display: none }
.filterbar { display: flex; flex-wrap: wrap; gap: 6px }
.filterbar button { padding: 0 11px; border: 1px solid var(--line); background: var(--surface); color: var(--muted) }
.filterbar button[aria-pressed="true"] { background: var(--tint); border-color: var(--accent-line); color: var(--accent-text) }
.decision-list { display: grid; gap: 10px }
.decision-card { max-width: 760px }
.decision-card h2 { font-size: 21px }
.decision-card .card-body { gap: 10px }
.badges { display: flex; flex-wrap: wrap; align-items: center; gap: 6px }
.recommendation { border: 1px solid var(--accent-line); background: var(--tint); border-radius: 8px; padding: 9px 10px }
.recommendation h3 { color: var(--accent-text); margin-bottom: 4px }
.options { display: grid; gap: 4px; list-style: none; padding: 0; margin: 6px 0 0 }
.options li { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px }
.chip { min-height: 44px; color: var(--accent-text) }
.chip:hover { border-color: var(--accent) }
.lane-directory { display: grid; gap: 8px }
.lane-search {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font: inherit;
}
.lane-row, .detail-row {
  display: flex; align-items: center; gap: 9px; min-width: 0; padding: 9px 12px; border-bottom: 1px solid var(--line);
}
.lane-row:last-child, .detail-row:last-child { border-bottom: 0; border-radius: 0 0 11px 11px }
.lane-row:hover, a.detail-row:hover, a.matrix-row:hover { background: var(--raised) }
.lane-row .row-copy, .detail-row .row-copy { flex: 1; min-width: 0; display: grid; gap: 3px }
.row-mark { display: grid; flex: none; width: 29px; height: 29px; place-items: center; border-radius: 7px;
  background: var(--raised); border: 1px solid var(--line) }
.row-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 9px }
.row-meta .meter { flex: 1 0 42px }
.row-meta .mono { white-space: nowrap }
.row-end { display: flex; flex-wrap: wrap; justify-content: end; align-items: center; gap: 4px 7px }
.detail-row .row-end { max-width: 42% }
.lane-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px }
.lane-back { min-height: 44px; padding-inline: 5px; color: var(--accent-text); font-weight: 600 }
.lane-back:hover { text-decoration: underline }
.lane-goal { font-size: 19px; font-weight: 650; line-height: 1.3; letter-spacing: -.02em }
.goal-history, .settled-prs { border-top: 1px solid var(--line) }
.disclosure-label { min-height: 44px; padding: 10px 12px; color: var(--accent-text); cursor: pointer; font-weight: 600 }
.history-heading { padding-inline: 12px }
.lane-blockers .decision-card { box-shadow: none }
.timeline { list-style: none; margin: 0; padding: 0 }
.timeline li { position: relative; padding: 7px 0 7px 33px; min-height: 48px }
.timeline li::before { content: ""; position: absolute; top: 20px; bottom: -12px; left: 11px; border-left: 1px solid var(--line-strong) }
.timeline li:last-child::before { display: none }
.timeline li .row-mark { position: absolute; top: 7px; left: 0; width: 23px; height: 23px; border-radius: 50%; z-index: 1 }
.timeline .icon { width: 14px; height: 14px }
.timeline time { display: block; color: var(--muted) }
@media (min-width: 640px) {
  .lane-detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (min-width: 960px) {
  .shell { grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: 48px 1fr }
  .app-header { grid-area: 1 / 2; justify-content: space-between; padding-inline: 22px }
  .app-header .brand { display: none }
  .tabbar { display: none }
  .rail {
    display: flex; flex-direction: column; position: sticky; top: 0; grid-area: 1 / 1 / 3 / 2;
    height: 100vh; height: 100dvh; overflow-y: auto; padding: 0 12px 14px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .rail .brand { min-height: 48px; margin-inline: -12px; padding-inline: 16px; border-bottom: 1px solid var(--line) }
  .rail nav { display: grid; gap: 4px; margin: 14px 0 }
  .rail nav a { min-height: 44px; padding: 0 9px; border: 1px solid transparent; border-radius: 7px; color: var(--muted) }
  .rail nav a:hover { background: var(--raised) }
  .rail nav a[aria-current="page"] { border-color: var(--accent-line) }
  .rail .nav-count { margin-left: auto; font: 13px var(--mono) }
  .rail-foot { margin-top: auto; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--canvas); font-size: 13px }
  .rail-foot p + p { margin-top: 7px }
  main { grid-area: 2 / 2; width: min(100%, 1280px); padding: 18px 22px 24px }
  h1 { font-size: 35px }
  .summary { gap: 10px }
  .tile { padding: 11px 13px }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .matrix-row { min-height: 36px }
  .matrix-head { min-height: 30px }
  .extras { display: grid }
}
@media (max-width: 374px) {
  .app-header { padding-inline: 8px }
  .brand { gap: 5px }
  .tile { padding-inline: 6px }
}
</style>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <a class="brand" href="#overview"><span class="brand-mark" data-icon="command"></span>Ostrom</a>
    <div class="lineup header-meta muted"><span id="live-dot" class="dot" aria-hidden="true"></span><span id="live">Connecting…</span></div>
    <span class="tag muted">Preview</span>
  </header>
  <aside class="rail">
    <a class="brand" href="#overview"><span class="brand-mark" data-icon="command"></span>Ostrom</a>
    <nav id="rail-nav" aria-label="Dashboard"></nav>
    <div class="rail-foot muted">
      <p class="lineup"><span class="dot" id="rail-dot" aria-hidden="true"></span><span id="rail-hosts">Waiting for hosts</span></p>
      <p class="lineup"><span data-icon="wallet"></span><span id="rail-spend">Weekly spend unavailable</span></p>
    </div>
  </aside>
  <main id="main">
    <p id="banner" class="banner" role="status" hidden></p>
    <div id="view" class="view"><h1>Overview</h1><p class="muted">Loading dashboard…</p></div>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="Dashboard"></nav>
</div>
<script type="module">
  const proxyAuth = document.documentElement.dataset.auth === "proxy";
  const tokenFragment = location.hash.startsWith("#token=");
  const token = !proxyAuth && tokenFragment ? new URLSearchParams(location.hash.slice(1)).get("token") : null;
  if (tokenFragment) history.replaceState(null, "", location.pathname + location.search);

  const icons = {
    command: "M9 7V6a2 2 0 1 0-2 2h10a2 2 0 1 0-2-2v12a2 2 0 1 0 2-2H7a2 2 0 1 0 2 2V7",
    home: "M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 21v-7h6v7",
    decision: "M21 15a2 2 0 0 1-2 2H9l-5 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z M8 9h9m-9 4h5",
    layers: "m12 3 9 5-9 5-9-5z M3 12l9 5 9-5M3 16l9 5 9-5",
    report: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm0 0v6h6M8 12h8m-8 4h8",
    check: "m5 12 4 4L19 6",
    alert: "M10.3 4.9 2.8 18a1.5 1.5 0 0 0 1.3 2.2h15.8a1.5 1.5 0 0 0 1.3-2.2L13.7 4.9a2 2 0 0 0-3.4 0zM12 9v4m0 3h.01",
    clock: "M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0",
    target: "M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0m-4 0a6 6 0 1 1-12 0 6 6 0 0 1 12 0m-4 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0",
    wallet: "M20 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-2m-5-8h7v8h-7a4 4 0 0 1 0-8zm1 4h.01",
    activity: "M2 12h4l3-8 5 16 3-8h5",
    chart: "M3 3v18h18M8 16v-3m5 3V8m5 8V5",
    pause: "M9 5v14m6-14v14",
    branch: "M6 6v12m12-9a6 6 0 0 1-6 6H6m0-9a2 2 0 1 0 0-4 2 2 0 0 0 0 4m0 16a2 2 0 1 0 0-4 2 2 0 0 0 0 4M18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4",
    codex: "M4 5h16v14H4z M7 9l3 3-3 3m6 0h4",
    gemini: "M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10Z",
    claude: "M12 2v20M2 12h20M5 5l14 14M5 19 19 5",
    back: "M20 12H5m6-6-6 6 6 6",
    arrow: "M4 12h15m-6-6 6 6-6 6",
  };
  const byId = (id) => document.getElementById(id);
  function el(tag, text = "", className = "") {
    const node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  }
  function group(tag, className, ...children) {
    const node = el(tag, "", className);
    node.append(...children);
    return node;
  }
  function svg(tag, attributes) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
    return node;
  }
  function icon(name, tone = "") {
    const node = svg("svg", { class: `icon ${tone}`, viewBox: "0 0 24 24", fill: "none",
      stroke: "currentColor", "stroke-width": "1.65", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
    node.append(svg("path", { d: icons[name] }));
    return node;
  }
  const tag = (text, tone = "muted") => el("span", text, `tag ${tone}`);
  const note = (text) => el("p", text, "muted");
  function card(title, mark, ...children) {
    const header = group("header", "card-head", group("span", "card-icon", icon(mark)), el("h2", title));
    return group("section", "card", header, ...children);
  }
  const body = (...children) => group("div", "card-body stack", ...children);
  const dayMs = 86_400_000;
  const clockGraceMs = 60_000;
  const stallSignal = "Stall signal: unavailable (awaiting Semon #788)";
  const utcDay = (time) => new Date(time).toISOString().slice(0, 10);
  const monday = (now) => utcDay(now - ((new Date(now).getUTCDay() + 6) % 7) * dayMs);
  const dayFormat = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const dateFormat = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
  const dueFormat = new Intl.DateTimeFormat("en-GB", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "UTC" });
  const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  const plural = (count, noun) => `${count} ${noun}${count === 1 ? "" : "s"}`;
  const text = (...values) => values.find((value) => typeof value === "string" && value.trim())?.trim();
  const planFor = (goal) => Array.isArray(goal?.weeklyPlan) ? goal.weeklyPlan[0] : goal?.weeklyPlan;
  const hasDetails = (value) => Array.isArray(value) ? value.length > 0 : Boolean(value);

  function dueDate(value) {
    const raw = text(value);
    if (!raw) return null;
    const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(raw);
    const time = Date.parse(dateOnly ? `${raw}T23:59:59.999Z` : raw);
    if (!Number.isFinite(time) || (dateOnly && utcDay(time) !== raw)) return null;
    return { time, label: dateOnly ? dayFormat.format(time) : `${dueFormat.format(time)}Z` };
  }

  function activityByDay(linkedPrs, goals, now) {
    const days = Array.from({ length: 7 }, (_, i) => ({ day: utcDay(now - (6 - i) * dayMs), prs: [], goals: [] }));
    const byDay = new Map(days.map((entry) => [entry.day, entry]));
    const merged = new Map();
    for (const pr of linkedPrs) {
      const time = Date.parse(pr.lastWakeAt);
      if (pr.state !== "merged" || !Number.isFinite(time) || time > now + clockGraceMs || !byDay.has(utcDay(time))) continue;
      const key = `${pr.prHost}/${pr.repository}/${pr.number}`.toLowerCase();
      if (!merged.has(key) || time > merged.get(key).time) {
        merged.set(key, { time, label: text(pr.title) ?? `${pr.repository} #${pr.number}` });
      }
    }
    for (const item of merged.values()) byDay.get(utcDay(item.time)).prs.push(item);
    for (const goal of goals) {
      const time = Date.parse(goal.completedAt);
      if (Number.isFinite(time) && time <= now + clockGraceMs) {
        byDay.get(utcDay(time))?.goals.push({ time, label: goal.statement });
      }
    }
    return days;
  }

  function laneRows(lanes, goals, decisions, alerts, week) {
    const current = new Map();
    for (const goal of goals) {
      if (goal.weekStart !== week) continue;
      const previous = current.get(goal.laneId);
      if (!previous || (previous.completedAt && !goal.completedAt)) current.set(goal.laneId, goal);
    }
    const atRisk = new Set(alerts.map(({ laneId }) => laneId));
    const needsOwner = new Set(decisions.map(({ laneId }) => laneId));
    return lanes.map((lane) => {
      const goal = current.get(lane.id);
      const plan = planFor(goal);
      const blocked = !goal?.completedAt && (hasDetails(plan?.blocker) || hasDetails(plan?.blockers));
      const risk = atRisk.has(lane.id) || needsOwner.has(lane.id) || blocked;
      const progressing = lane.status === "active" && goal && !goal.completedAt;
      const status = atRisk.has(lane.id) ? "At risk" : needsOwner.has(lane.id) ? "Waiting on owner"
        : blocked ? "Blocked" : lane.status === "paused" ? "Paused" : lane.status === "archived" ? "Archived"
          : goal?.completedAt ? "Done" : goal ? "Active" : "No goal";
      const tone = risk ? "warn" : status === "Done" ? "good" : status === "Active" ? "accent" : "muted";
      return { lane, goal, status, tone, rank: risk ? 0 : progressing ? 1 : 2 };
    }).sort((a, b) => a.rank - b.rank || a.lane.priorityRank - b.lane.priorityRank || a.lane.name.localeCompare(b.lane.name));
  }

  function context({ digest, health, friction, linkedPrs, goals, spend }, now) {
    const lanes = digest.sections.lanes;
    const decisions = health.pendingOwnerDecisions;
    const alerts = health.policyAlerts;
    const generatedAt = Date.parse(digest.generatedAt);
    const observedAt = Number.isFinite(generatedAt) ? generatedAt : now;
    const week = monday(observedAt);
    return {
      now, observedAt, digest, health, friction, spend, week, decisions, alerts,
      lanes: laneRows(lanes, goals, decisions, alerts, week),
      laneNames: new Map(lanes.map(({ id, name }) => [id, name])),
      activity: activityByDay(linkedPrs, goals, observedAt),
    };
  }

  function alertLabel(alert, laneNames) {
    const { repository, number } = alert.detail ?? {};
    if (typeof repository === "string" && Number.isInteger(number)) {
      return `${laneNames.get(alert.laneId) ?? repository} #${number}`;
    }
    return alert.summary;
  }

  function summaryTiles(ctx) {
    const today = ctx.activity.at(-1);
    const recent = [...today.prs, ...today.goals].sort((a, b) => b.time - a.time)
      .slice(0, 2).map(({ label }) => label);
    const waitingLanes = [...new Set(ctx.decisions.map(({ laneId }) => ctx.laneNames.get(laneId) ?? "Team"))];
    const tiles = [
      ["Shipped today", "check", "good", `${plural(today.prs.length, "PR")} · ${plural(today.goals.length, "goal")}`,
        recent.join(" · ") || "None recorded yet today"],
      ["At risk", "alert", ctx.alerts.length ? "warn" : "good", plural(ctx.alerts.length, "alert"),
        ctx.alerts.length ? alertLabel(ctx.alerts[0], ctx.laneNames) : "All clear"],
      ["Needs you", "decision", "accent", plural(ctx.decisions.length, "decision"),
        waitingLanes.join(", ") || "No pending decisions", "#decisions"],
    ];
    return group("section", "summary", ...tiles.map(([label, mark, tone, count, detail, href]) => {
      const tile = group(href ? "a" : "div", href ? "tile callout" : "tile",
        group("span", "tile-label", icon(mark, tone), el("span", label)), el("strong", count), el("p", detail));
      if (href) tile.href = href;
      return tile;
    }));
  }

  function meter(current, target, label, tone = "") {
    const bar = el("div", "", `meter ${tone}`);
    if (Number.isFinite(current) && target > 0) {
      const fill = el("span");
      fill.style.setProperty("--fill", `${Math.max(0, Math.min(100, current / target * 100))}%`);
      bar.append(fill);
    }
    bar.setAttribute("role", "img");
    bar.setAttribute("aria-label", label);
    return bar;
  }

  function laneLink(lane, className, ...children) {
    const link = group("a", className, ...children);
    link.href = `#lane/${encodeURIComponent(lane.slug)}`;
    link.dataset.focus = `${className}:${lane.id}`;
    return link;
  }

  function goalTable(rows) {
    if (!rows.length) return body(note("No lanes registered."));
    const columns = group("div", "matrix-row matrix-head", ...["Lane", "", "Done", "Due"].map((label) => el("span", label)));
    return group("div", "", columns, ...rows.map(({ lane, goal, status, tone }) => {
      const progress = goal ? `${goal.metricCurrent ?? "—"}/${goal.metricTarget}` : "—";
      const plan = planFor(goal);
      const due = dueDate(plan?.due) ?? dueDate(plan?.targetDate);
      const mark = { warn: "alert", good: "check", accent: "activity", muted: "pause" }[tone];
      const name = group("span", "", el("span", lane.name), el("span", status, `goal-status ${tone}`));
      const laneCell = group("div", "lineup", icon(mark, tone), name);
      const progressLabel = goal ? `${goal.metricName}: ${progress}` : "No current-week goal";
      return laneLink(lane, "matrix-row", laneCell, meter(goal?.metricCurrent, goal?.metricTarget, progressLabel, tone),
        el("span", progress, "mono"), el("span", due ? dayFormat.format(due.time) : "—", "mono muted"));
    }));
  }

  let showAll = false;
  function goalsCard(ctx, limited = false) {
    const rows = limited && !showAll ? ctx.lanes.slice(0, 8) : ctx.lanes;
    const panel = card("Weekly goal progress", "target", goalTable(rows));
    panel.firstChild.append(tag(`Week of ${dayFormat.format(Date.parse(ctx.week))}`));
    if (limited && ctx.lanes.length > 8) {
      const toggle = el("button", showAll ? "Show top 8 lanes" : `Show all ${ctx.lanes.length} lanes`, "inline-button");
      toggle.type = "button";
      toggle.dataset.focus = "all-lanes";
      toggle.setAttribute("aria-expanded", String(showAll));
      toggle.onclick = () => { showAll = !showAll; render(); };
      panel.append(group("div", "card-foot", toggle));
    }
    return panel;
  }

  // Only team rollups have observedAt. Session snapshots cannot describe team spend.
  const amount = (summary) => summary?.status === "available" && summary.observedAt && Number.isFinite(summary.preferredUsd)
    ? summary.preferredUsd : null;
  const money = (value) => value === null ? "Unavailable" : usd.format(value);

  function spendCard({ spend, health }) {
    const periods = [["daily", "Today"], ["weekly", "This week"], ["monthly", "Month est."]];
    const snapshots = periods.map(([period]) => spend[period]);
    const coverage = snapshots.some((summary) => amount(summary) !== null && summary.coverage === "partial") ? "Partial"
      : snapshots.every((summary) => amount(summary) !== null && summary.coverage === "complete") ? "Complete" : "Unknown";
    const totals = group("dl", "metrics", ...periods.map(([period, label]) =>
      group("div", "", el("dt", label), el("dd", money(amount(spend[period]))))));
    const budget = [...periods].reverse().map(([period]) => health.budgets.find((item) =>
      item.enabled && item.scopeKind === "team" && item.period === period)).find(Boolean);
    const budgetLine = group("div", "budget");
    if (budget) {
      const used = budget.spendSource === "semon" ? amount(spend[budget.period]) : null;
      const label = `${money(used)} / ${usd.format(budget.capUsd)} · ${budget.period} cap`;
      budgetLine.append(note(label));
      if (used !== null) budgetLine.append(meter(used, budget.capUsd, label,
        used >= budget.capUsd * budget.warnPct / 100 ? "warn" : "accent"));
    } else {
      budgetLine.append(note("No team budget configured"));
    }
    const panel = card("Spend", "wallet", body(totals, note("Semon · USD · month to date"), budgetLine,
      note("By-model & by-lane breakdown: No data yet (awaiting Semon rollup)")));
    panel.firstChild.append(tag(coverage, { Complete: "good", Partial: "warn", Unknown: "muted" }[coverage]));
    return panel;
  }

  function duration(ms) {
    const seconds = Math.max(0, Math.floor(ms / 1000));
    if (seconds < 60) return `${seconds}s`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    return hours < 24 ? `${hours}h ${minutes % 60}m` : `${Math.floor(hours / 24)}d ${hours % 24}h`;
  }

  function modelBadge(run) {
    const model = text(run.model)?.split("/").filter(Boolean).at(-1);
    const harness = (run.harness ?? run.semonIdentity?.nativeHarness ?? run.connectorKind ?? "").toLowerCase();
    const provider = /^gpt-|^o[1-9](-|$)|^codex/.test(model ?? "") ? "codex"
      : /^gemini/.test(model ?? "") ? "gemini" : /^claude/.test(model ?? "") ? "claude"
        : { codex: "codex", claude: "claude", gemini: "gemini" }[harness];
    const label = [{ codex: "Codex", gemini: "Gemini", claude: "Claude" }[provider], model].filter(Boolean).join(" · ");
    return provider ? group("span", "model", icon(provider), el("span", label)) : el("span", label, "model");
  }

  const runStatusTags = { running: ["Running", "good"], waiting_input: ["Waiting for input", "warn"],
    waiting_approval: ["Waiting for approval", "warn"] };
  const runStatus = (status) => tag(...(runStatusTags[status] ?? ["Status unavailable", "muted"]));
  function runElapsed(run, now) {
    const started = Date.parse(run.startedAt);
    return Number.isFinite(started) ? el("span", duration(now - started), "mono micro muted") : el("span", "", "muted");
  }

  const overviewRunLimit = 5;
  let showAllRuns = false;
  function fleetCard({ health, now, observedAt }) {
    const recentAgents = health.agents.filter((agent) => {
      const seen = Date.parse(agent.lastSeenAt);
      return agent.status === "active" || agent.status === "waiting" || (seen >= observedAt - dayMs && seen <= observedAt + clockGraceMs);
    });
    const states = [["active", "active", "good"], ["waiting", "waiting", "warn"],
      ["idle", "recent idle", "accent"], ["offline", "offline", "muted"]];
    if (recentAgents.some(({ status }) => status === "unknown")) states.push(["unknown", "unknown", "muted"]);
    const bar = el("div", "", "fleet-bar");
    bar.setAttribute("aria-hidden", "true");
    const legend = el("div", "", "fleet-legend");
    for (const [status, label, tone] of states) {
      const count = recentAgents.filter((agent) => agent.status === status).length;
      if (count) {
        const segment = el("span", "", tone);
        segment.style.setProperty("--count", count);
        bar.append(segment);
      }
      legend.append(group("span", "lineup", el("i", "", `dot ${tone}`), el("span", `${count} ${label}`)));
    }
    const agents = new Map(health.agents.map((agent) => [agent.id, agent]));
    const count = health.activeRuns.length;
    const visibleRuns = showAllRuns ? health.activeRuns : health.activeRuns.slice(0, overviewRunLimit);
    const runs = visibleRuns.map((run) => {
      const label = agents.get(run.agentId)?.label ?? run.externalRunRef;
      return group("li", "run-row", group("div", "", el("strong", label), modelBadge(run)),
        group("div", "lineup", runStatus(run.status), runElapsed(run, now)));
    });
    const list = group("ul", "rows", ...runs);
    list.id = "overview-active-runs";
    const toggle = el("button", showAllRuns ? "Show fewer active runs" : `Show all ${count} active runs`, "inline-button");
    toggle.type = "button";
    toggle.dataset.focus = "overview-run-toggle";
    toggle.setAttribute("aria-expanded", String(showAllRuns));
    toggle.setAttribute("aria-controls", list.id);
    toggle.onclick = () => { showAllRuns = !showAllRuns; render(); };
    return card("Fleet health", "activity", body(bar, legend, note("Last 24h · older idle excluded"), el("h3", "Active runs"),
      runs.length ? list : note("No active runs."), ...(count > overviewRunLimit ? [toggle] : []),
      note(stallSignal)));
  }

  function throughput(days) {
    const counts = days.map(({ day, prs, goals }) => ({ day, prs: prs.length, goals: goals.length }));
    const max = Math.max(...counts.flatMap(({ prs, goals }) => [prs, goals]));
    if (!max) return note("No data yet");
    const labels = counts.map(({ day, prs, goals }) =>
      `${dayFormat.format(Date.parse(day))}: ${plural(prs, "PR")} merged, ${plural(goals, "goal")} completed`);
    const chart = svg("svg", { class: "chart", viewBox: "0 0 350 90", role: "img",
      "aria-label": labels.join(". ") });
    chart.append(svg("line", { x1: 0, x2: 350, y1: 82, y2: 82 }));
    for (const [index, { prs, goals }] of counts.entries()) {
      const day = svg("g", {});
      const title = svg("title", {});
      title.textContent = labels[index];
      day.append(title);
      const x = index * 50 + 25;
      const height = prs / max * 70;
      if (prs) day.append(svg("rect", { x: x - 12, y: 82 - height, width: 24, height, rx: 2 }));
      if (goals) day.append(svg("circle", { cx: x, cy: 82 - goals / max * 70, r: 4 }));
      chart.append(day);
    }
    const dates = group("div", "chart-days", ...counts.map(({ day }) => el("time", day.slice(8))));
    dates.setAttribute("aria-hidden", "true");
    const totals = counts.reduce((sum, day) => ({ prs: sum.prs + day.prs, goals: sum.goals + day.goals }), { prs: 0, goals: 0 });
    const legend = group("div", "chart-legend muted",
      group("span", "lineup", el("i", "", "key"), el("span", `${plural(totals.prs, "PR")} merged`)),
      group("span", "lineup", el("i", "", "dot good"), el("span", `${plural(totals.goals, "goal")} completed`)));
    return group("div", "stack", legend, group("div", "", chart, dates));
  }

  function throughputCard({ activity, friction }) {
    const panel = card("Daily throughput", "chart", body(throughput(activity)),
      group("div", "card-foot", el("strong", `${friction.length} open friction`),
        ...(friction.length ? [el("p", friction[0].summary)] : [])));
    panel.firstChild.append(tag("7 days · UTC"));
    return panel;
  }

  const decisionDue = (decision) => dueDate(decision.evidence?.due);
  const soon = (due, now) => due && due.time - now < 2 * dayMs;
  const blocking = (decision) => decision.urgency === "blocking_today" || decision.urgency === "incident"
    || hasDetails(decision.evidence?.blocks);
  const urgencyTags = { incident: ["Incident", "bad"], blocking_today: ["Blocking today", "warn"], digest: ["Digest", "muted"] };
  function jsonText(value) {
    return text(value, value?.label, value?.title, value?.text, value?.summary, value?.description) ?? JSON.stringify(value);
  }

  function githubPr(value) {
    if (typeof value !== "string" || URL.parse(value)?.href !== value) return null;
    return /^https:\/\/github\.com\/([a-z\d-]+\/[\w.-]+)\/pull\/([1-9]\d*)$/i.exec(value);
  }

  function prChip(value) {
    const path = githubPr(value);
    if (!path) return null;
    const link = group("a", "tag chip", icon("branch"), el("span", `${path[1]} #${path[2]}`));
    link.href = value;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    return link;
  }

  function decisionCard(decision, ctx, heading = "h2") {
    const due = decisionDue(decision);
    const lane = ctx.laneNames.get(decision.laneId) ?? "Team";
    const tags = group("div", "badges", tag(lane, "accent"));
    if (due) {
      const overdue = due.time < ctx.now;
      tags.append(tag(`${overdue ? "Overdue" : "Due"} ${due.label}`, overdue ? "bad" : soon(due, ctx.now) ? "warn" : "muted"));
    }
    tags.append(tag(...urgencyTags[decision.urgency]));
    const info = body(tags, el(heading, decision.title), group("div", "recommendation",
      el("h3", "Recommended"), el("p", decision.recommendation)));
    if (Array.isArray(decision.options) && decision.options.length) {
      const options = decision.options.map(jsonText).filter((option, index) => index !== 0 || option !== decision.recommendation);
      if (options.length) info.append(group("div", "", el("h3", "Options"),
        group("ul", "options", ...options.map((option) => el("li", option)))));
    }
    const blocks = decision.evidence?.blocks;
    if (hasDetails(blocks)) {
      info.append(group("p", "", el("strong", "Blocks "), el("span", Array.isArray(blocks)
        ? blocks.map(jsonText).join(" · ") : jsonText(blocks))));
    }
    const prs = decision.evidence?.prs;
    if (Array.isArray(prs)) {
      const chips = prs.map(prChip).filter(Boolean);
      if (chips.length) {
        for (const chip of chips) chip.dataset.focus = `${decision.id}:${chip.href}`;
        info.append(group("div", "badges", ...chips));
      }
    }
    return group("article", "card decision-card", info, el("footer", "Read-only · Answer in chat", "card-foot micro"));
  }

  let decisionFilter = "all";
  function decisionsView(ctx) {
    const filters = [["all", `All (${ctx.decisions.length})`], ["due", "Due soon"], ["blocking", "Blocking"]];
    const filterbar = group("div", "filterbar", ...filters.map(([key, label]) => {
      const button = el("button", label);
      button.type = "button";
      button.dataset.focus = key;
      button.setAttribute("aria-pressed", String(decisionFilter === key));
      button.onclick = () => { decisionFilter = key; render(); };
      return button;
    }));
    const visible = ctx.decisions.filter((decision) => decisionFilter === "all"
      || (decisionFilter === "due" && soon(decisionDue(decision), ctx.now))
      || (decisionFilter === "blocking" && blocking(decision)));
    return [el("h1", "Decisions"), filterbar, visible.length
      ? group("div", "decision-list", ...visible.map((decision) => decisionCard(decision, ctx)))
      : group("div", "card", body(note(ctx.decisions.length ? "No decisions match this filter." : "No pending owner decisions.")))];
  }

  const laneStates = {
    risk: ["At risk", "warn", "alert"], waiting: ["Waiting", "accent", "decision"],
    active: ["Active", "good", "activity"], paused: ["Paused", "muted", "pause"],
    archived: ["Archived", "muted", "layers"],
  };
  const values = (value) => Array.isArray(value) ? value : [value];
  function planBlockers(goal) {
    const plan = planFor(goal);
    return !goal || goal.completedAt ? [] : [...values(plan?.blocker), ...values(plan?.blockers)]
      .filter(Boolean).map(jsonText);
  }

  function laneState(lane, goal, alerts, waiting) {
    if (lane.status === "paused" || lane.status === "archived") return lane.status;
    if (alerts || planBlockers(goal).length) return "risk";
    return waiting ? "waiting" : "active";
  }

  const rowMark = (mark, tone = "muted") => group("span", `row-mark ${tone}`, icon(mark));
  const progress = (goal) => `${goal.metricCurrent ?? "—"}/${goal.metricTarget}`;
  function goalProgress(goal, tone) {
    const plan = planFor(goal);
    const due = dueDate(plan?.due) ?? dueDate(plan?.targetDate);
    return group("div", "row-meta", meter(goal.metricCurrent, goal.metricTarget, `${goal.metricName}: ${progress(goal)}`, tone),
      el("span", `Done ${progress(goal)}`, "mono"), el("span", `Due ${due ? dayFormat.format(due.time) : "—"}`, "mono muted"));
  }

  let laneFilter = "all";
  let laneSearch = "";
  function lanesDirectory(ctx) {
    const pending = new Set(ctx.decisions.map(({ laneId }) => laneId));
    const atRisk = new Set(ctx.alerts.map(({ laneId }) => laneId));
    const waiting = new Set(ctx.health.agents.filter(({ status }) => status === "waiting").map(({ id }) => id));
    const search = el("input", "", "lane-search");
    search.type = "search";
    search.placeholder = "Search lanes";
    search.setAttribute("aria-label", "Search lanes");
    search.dataset.focus = "lane-search";
    search.value = laneSearch;
    const list = el("div");
    function updateRows() {
      const query = laneSearch.trim().toLowerCase();
      const rows = ctx.lanes.flatMap(({ lane, goal: weeklyGoal }) => {
        const goal = lane.goal ?? weeklyGoal;
        const state = laneState(lane, goal, atRisk.has(lane.id), pending.has(lane.id) || waiting.has(lane.ownerAgentId));
        if (laneFilter !== "all" && laneFilter !== state) return [];
        if (query && ![lane.name, lane.slug, goal?.statement].some((value) => value?.toLowerCase().includes(query))) return [];
        const [label, tone, mark] = laneStates[state];
        return [laneLink(lane, "lane-row", rowMark(mark, tone), group("div", "row-copy",
          group("div", "row-meta", el("strong", lane.name), tag(label, tone)),
          note(goal?.statement ?? "No goal recorded"), ...(goal ? [goalProgress(goal, tone)] : [])), el("span", "›", "accent"))];
      });
      list.replaceChildren(...(rows.length ? rows : [body(note(ctx.lanes.length ? "No lanes match these filters." : "No lanes registered."))]));
    }
    const filters = [["all", "All"], ...Object.entries(laneStates).filter(([key]) => key !== "archived")
      .map(([key, [label]]) => [key, label])];
    const buttons = filters.map(([key, label]) => {
      const button = el("button", label);
      button.type = "button";
      button.dataset.focus = `lane-filter:${key}`;
      button.setAttribute("aria-pressed", String(laneFilter === key));
      button.onclick = () => {
        laneFilter = key;
        for (const item of buttons) item.setAttribute("aria-pressed", String(item === button));
        updateRows();
      };
      return button;
    });
    search.oninput = () => { laneSearch = search.value; updateRows(); };
    updateRows();
    return [el("h1", "Lanes"), group("div", "lane-directory", search, group("div", "filterbar", ...buttons)),
      card("Lane directory", "layers", list)];
  }

  const openDisclosures = new Set();
  function disclosure(key, label, className, ...children) {
    const summary = el("summary", label, "disclosure-label");
    summary.dataset.focus = key;
    const panel = group("details", className, summary, ...children);
    panel.open = openDisclosures.has(key);
    panel.ontoggle = () => {
      if (panel.open) openDisclosures.add(key);
      else openDisclosures.delete(key);
    };
    return panel;
  }

  function laneGoalCard(lane, goal, history) {
    const current = goal && !goal.completedAt ? goal : null;
    const plan = planFor(current);
    const next = text(plan?.nextStep, plan?.next,
      ...(Array.isArray(current?.weeklyPlan) ? [plan, plan?.title, plan?.summary, plan?.text] : []));
    const prior = history.filter(({ id }) => id !== current?.id);
    const rows = prior.map((entry) => group("li", "detail-row", rowMark(entry.completedAt ? "check" : "target", entry.completedAt ? "good" : "muted"),
      group("div", "row-copy", el("strong", entry.statement), note(`Week of ${entry.weekStart} · ${entry.metricName} ${progress(entry)}`)),
      ...(entry.completedAt ? [tag("Completed", "good")] : [])));
    return card("Current Goal & Next Step", "target", current ? body(el("p", current.statement, "lane-goal"),
      goalProgress(current, "accent"), ...(next ? [group("p", "lineup", icon("arrow", "accent"), el("span", `Next: ${next}`))] : []))
      : body(note("No active goal recorded")), rows.length
      ? disclosure(`goal-history:${lane.id}`, `Goal History · ${rows.length}`, "goal-history", group("ul", "rows", ...rows))
      : group("div", "card-foot stack", el("h3", "Goal History"), note("No prior goals recorded yet")));
  }

  const prStates = { failure: ["Failing", "bad"], error: ["CI unavailable", "warn"],
    pending: ["Pending", "accent"], success: ["Passing", "good"] };
  const isSettledPr = (pr) => pr.state === "merged" || pr.state === "closed" || pr.rollupState === "closed";
  function prCause(pr) {
    if (isSettledPr(pr)) return pr.state === "merged" ? "merged" : "closed";
    switch (pr.rollupState) {
    case "failure": {
      const count = pr.totalChecks > 0 && pr.failedChecks > 0 ? `${pr.failedChecks}/${pr.totalChecks} checks failed` : "Checks failed";
      return pr.consecutiveFailures > 0 ? `${count} · ${plural(pr.consecutiveFailures, "consecutive head")}` : count;
    }
    case "error": return pr.lastError ?? "GitHub PR checks unavailable";
    case "pending": return pr.consecutiveFailures > 0 ? "re-running" : "Checks pending";
    case "success": return "Checks passed";
    default: return "No CI observation";
    }
  }
  function prRow(pr) {
    const settled = isSettledPr(pr);
    const state = settled ? (pr.state === "merged" ? ["Merged", "good"] : ["Closed", "muted"])
      : prStates[pr.rollupState] ?? (pr.isDraft ? ["Draft", "muted"] : [pr.state === "open" ? "Open" : "State unavailable", "muted"]);
    const link = githubPr(pr.url);
    const row = group(link ? "a" : "div", "detail-row", rowMark(settled && pr.state === "merged" ? "check" : "branch", state[1]),
      group("div", "row-copy", el("strong", `#${pr.number}${pr.title ? ` ${pr.title}` : ""}`),
        note(`${pr.repository} · ${prCause(pr)}`)), group("span", "row-end", tag(...state), ...(link ? [el("span", "›", "accent")] : [])));
    if (link) {
      row.href = pr.url;
      row.target = "_blank";
      row.rel = "noopener noreferrer";
      row.dataset.focus = pr.url;
    }
    return row;
  }

  function lanePrCard(lane, prs) {
    if (!prs.length) return card("Recent PRs & Merges", "branch", body(note("No linked PRs yet")));
    const priority = (pr) => ["failure", "error"].includes(pr.rollupState) ? 0 : pr.rollupState === "pending" ? 1 : 2;
    const recent = (a, b) => (b.lastWakeAt ?? b.lastCheckedAt ?? "").localeCompare(a.lastWakeAt ?? a.lastCheckedAt ?? "")
      || b.number - a.number;
    const open = prs.filter((pr) => !isSettledPr(pr)).sort((a, b) => priority(a) - priority(b) || recent(a, b));
    const settled = prs.filter(isSettledPr).sort(recent);
    return card("Recent PRs & Merges", "branch", group("div", "", ...open.map(prRow), ...(settled.length <= 5 ? settled.map(prRow) : [])),
      ...(settled.length > 5 ? [disclosure(`settled-prs:${lane.id}`, `Merged & closed · ${settled.length}`, "settled-prs", ...settled.map(prRow))] : []));
  }

  function laneRunsCard(lane, runs, now) {
    const rows = runs.map((run) => group("li", "detail-row", rowMark(run.status === "running" ? "activity" : "clock",
      run.status === "running" ? "good" : "muted"), group("div", "row-copy", el("strong", run.agentLabel), modelBadge(run)),
      group("div", "row-end", runStatus(run.status), runElapsed(run, now))));
    return card("Running Workers", "activity", rows.length ? group("ul", "rows", ...rows) : body(note(`No active runs on ${lane.name}`)),
      group("div", "card-foot", note(stallSignal)));
  }

  function laneSpendCard(spend) {
    if (spend.status !== "available") return card("Lane Spend", "wallet", body(note("No data yet · awaiting per-lane Semon rollup")));
    const total = Number.isFinite(spend.preferredUsd) ? usd.format(spend.preferredUsd) : "Unpriced";
    return card("Lane Spend", "wallet", body(group("div", "row-meta", el("strong", total, "lane-goal"),
      tag(`Coverage: ${spend.coverage}`, spend.coverage === "complete" ? "good" : "warn")), note("This week · Semon · USD")));
  }

  function laneBlockersCard(detail, pending, now) {
    const notices = [...new Set([...detail.alerts.map(({ summary }) => summary), ...planBlockers(detail.goal),
      ...detail.friction.map(({ summary }) => summary)])];
    const decisions = pending.map((decision) => decisionCard(decision, { now, laneNames: new Map([[detail.lane.id, detail.lane.name]]) }, "h3"));
    return card("Decisions & Blockers", "decision", group("div", "card-body stack lane-blockers",
      ...decisions, ...(notices.length ? [group("ul", "rows", ...notices.map((summary) =>
        group("li", "lineup", icon("alert", "warn"), el("span", summary))))] : []),
      ...(!decisions.length && !notices.length ? [note("No open blockers or decisions")] : [])));
  }

  const timelineIcons = { goal_updated: ["target", "accent"], goal_completed: ["check", "good"],
    decision_created: ["decision", "accent"], decision_answered: ["check", "good"], policy_alert: ["alert", "warn"],
    pr_wake: ["branch", "muted"], pr_merged: ["branch", "good"] };
  function laneTimeline(events) {
    const rows = events.map(({ kind, at, summary }) => {
      const time = el("time", `${new Date(at).toISOString().slice(0, 19).replace("T", " ")} UTC`);
      time.dateTime = at;
      return group("li", "", rowMark(...timelineIcons[kind]), el("p", summary), time);
    });
    return card("Activity Timeline", "clock", body(rows.length ? group("ol", "timeline", ...rows) : note("No recent activity recorded yet")));
  }

  function laneDetailView(result, slug, now) {
    const back = group("a", "lineup lane-back", icon("back"), el("span", "Lanes"));
    back.href = "#lanes";
    back.dataset.focus = "lane-back";
    const top = group("div", "lane-top", back);
    const detail = result?.value;
    if (!detail) return [top, el("h1", "Lane"), note(!slug || result?.error?.status === 404 ? "Lane not found."
      : result?.error ? `Lane data unavailable. ${result.error.message}` : "Loading lane…")];
    const { lane, goal, goalHistory, prs, activeRuns, recentAgents, spend, decisions, alerts, timeline } = detail;
    const pending = decisions.filter(({ authority, status }) => authority === "owner" && status === "pending");
    const waiting = pending.length > 0 || recentAgents.some(({ id, status }) => id === lane.ownerAgentId && status === "waiting");
    const [stateLabel, tone] = laneStates[laneState(lane, goal, alerts.length, waiting)];
    const modeledRuns = activeRuns.filter((run) => run.model && run.status !== "unknown");
    const manager = modeledRuns.find((run) => run.isLaneOwner) ?? modeledRuns.find((run) => run.role === "manager");
    top.append(group("div", "badges", tag(stateLabel, tone), ...(manager ? [modelBadge(manager)] : [])));
    return [top, el("h1", lane.name), ...(result.error ? [note(`Stale lane data. ${result.error.message}`)] : []),
      group("div", "grid lane-detail-grid", laneGoalCard(lane, goal, goalHistory), lanePrCard(lane, prs),
        laneRunsCard(lane, activeRuns, now), laneSpendCard(spend), laneBlockersCard(detail, pending, now), laneTimeline(timeline))];
  }

  function overview(ctx) {
    const top = group("div", "hero", group("div", "", el("h1", "Overview"), note(dateFormat.format(ctx.now))),
      tag(`Week of ${dayFormat.format(Date.parse(ctx.week))}`));
    const visuals = group("div", "grid", goalsCard(ctx, true), spendCard(ctx), fleetCard(ctx), throughputCard(ctx));
    const decisions = ctx.decisions.map((decision) => decisionCard(decision, ctx));
    const alerts = ctx.alerts.length ? group("ul", "rows", ...ctx.alerts.map((alert) => {
      const label = alertLabel(alert, ctx.laneNames);
      return group("li", "", el("strong", label), ...(label !== alert.summary ? [note(alert.summary)] : []));
    })) : note("No open policy alerts.");
    const priorities = ctx.lanes.filter(({ lane, rank }) => rank === 0 || lane.status === "active").slice(0, 5);
    const extras = group("div", "grid extras",
      group("section", "stack", el("h2", "Decisions needed"), ...(decisions.length ? decisions : [note("No pending owner decisions.")])),
      card("Active alerts & priority lanes", "alert", body(alerts,
        ...(priorities.length ? [group("ul", "rows", ...priorities.map(({ lane, status }) =>
          group("li", "", laneLink(lane, "lineup", el("span", `${lane.name} · ${status}`), el("span", "›", "accent")))))] : []))));
    return [top, summaryTiles(ctx), visuals, extras];
  }

  function digestCard(title, digest) {
    if (!digest) return card(title, "report", body(note(digest === null ? "Weekly digest unavailable." : "Loading weekly digest…")));
    const { decisions, policyAlerts, interventionsByDay, openFrictionCount, topOpenFriction } = digest.sections;
    const ownerDecisions = decisions.filter(({ authority }) => authority === "owner");
    const items = [
      plural(ownerDecisions.length, "owner decision"),
      plural(policyAlerts.length, "policy alert"),
      `${openFrictionCount} open friction`,
    ];
    const interventions = interventionsByDay.map(({ day, count }) => `${dayFormat.format(Date.parse(day))} (${count})`);
    return card(title, "report", body(
      note(`Generated ${digest.generatedAt.slice(0, 16).replace("T", " ")} UTC`),
      el("p", items.join(" · ")),
      ...(ownerDecisions.length ? [group("ul", "rows", ...ownerDecisions.map(({ title }) => el("li", title)))] : []),
      ...(topOpenFriction ? [note(topOpenFriction.summary)] : []),
      el("h3", "Owner interventions by UTC day"), note(interventions.join(" · "))));
  }

  const routes = {
    overview: ["Overview", "Home", "home"],
    decisions: ["Decisions", "Decisions", "decision"],
    lanes: ["Lanes", "Lanes", "layers"],
    report: ["Reports", "Report", "report"],
  };
  function route() {
    const hash = location.hash.slice(1);
    if (hash.startsWith("lane/")) return "lane";
    return Object.hasOwn(routes, hash) ? hash : "overview";
  }
  function laneSlug() {
    try {
      const slug = decodeURIComponent(location.hash.slice("#lane/".length));
      return /^[a-z\d][\w.-]{0,127}$/i.test(slug) ? slug : null;
    } catch {
      return null;
    }
  }
  function routeEndpoint() {
    const selected = route();
    if (selected === "report") return "/v1/digest?window=weekly";
    if (selected !== "lane") return null;
    const slug = laneSlug();
    return slug === null ? null : `/v1/lanes/${encodeURIComponent(slug)}/detail`;
  }
  function navigation(mobile) {
    return Object.entries(routes).map(([key, [desktopLabel, mobileLabel, mark]]) => {
      const badge = el("span", "", "nav-count");
      badge.hidden = true;
      const markNode = mobile ? group("span", "tab-icon", icon(mark), badge) : icon(mark);
      const link = group("a", mobile ? "" : "lineup", markNode, el("span", mobile ? mobileLabel : desktopLabel));
      if (!mobile) link.append(badge);
      link.href = `#${key}`;
      return { key, badge, link, mobile };
    });
  }

  function render() {
    const selected = route();
    for (const { key, badge, link, mobile } of navItems) {
      if (key === (selected === "lane" ? "lanes" : selected)) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
      const count = key === "decisions" ? ctx?.decisions.length : key === "lanes" && !mobile ? ctx?.lanes.length : undefined;
      badge.hidden = count === undefined || (mobile && count === 0);
      badge.textContent = count ?? "";
    }
    const view = byId("view");
    const active = document.activeElement;
    const focus = active?.dataset?.focus;
    const result = routeResult?.endpoint === routeEndpoint() ? routeResult : undefined;
    const nodes = selected === "lane" ? laneDetailView(result, laneSlug(), Date.now())
      : selected === "report" ? [el("h1", "Reports"), note("The full Executive Report arrives in Slice 3."),
        group("div", "grid", ...(ctx ? [digestCard("Daily digest · 13:00Z", ctx.digest)] : []),
          digestCard("Weekly digest", result?.value ?? (result?.error ? null : undefined)))]
        : !ctx ? [el("h1", routes[selected][0])]
          : selected === "decisions" ? decisionsView(ctx)
            : selected === "lanes" ? lanesDirectory(ctx) : overview(ctx);
    view.replaceChildren(...nodes);
    const heading = view.querySelector("h1");
    if (heading) {
      heading.tabIndex = -1;
      heading.dataset.focus = "route-heading";
    }
    if (focus) {
      const replacement = [...view.querySelectorAll("[data-focus]")].find((node) => node.dataset.focus === focus);
      replacement?.focus({ preventScroll: true });
      if (focus === "lane-search" && Number.isInteger(active.selectionStart)) {
        replacement?.setSelectionRange(active.selectionStart, active.selectionEnd);
      }
    }
  }

  async function read(path) {
    const response = await fetch(path, {
      headers: proxyAuth ? {} : { Authorization: `Bearer ${token}` },
      cache: "no-store", redirect: "error", signal: AbortSignal.timeout(10_000),
    });
    if (response.status === 401 || response.status === 403) throw new Error("Dashboard authorization failed.");
    if (!response.ok) throw Object.assign(new Error(`Platform returned HTTP ${response.status}.`), { status: response.status });
    return response.json();
  }

  const refreshMs = 8_000;
  let ctx;
  let routeResult;
  let routeRequest;
  let lastSuccess;
  let refreshFailed = false;
  const hostCount = () => `${ctx.health.hosts.filter(({ connectionState }) => connectionState === "connected").length}/${ctx.health.hosts.length}`;
  function updateAge() {
    if (lastSuccess) {
      byId("live").textContent = `${hostCount()} hosts · ${refreshFailed ? "last update" : "updated"} ${duration(Date.now() - lastSuccess)} ago`;
    }
  }
  function updateStatus() {
    if (ctx) {
      byId("rail-hosts").textContent = `${hostCount()} connected`;
      byId("rail-spend").textContent = `Weekly Semon · ${money(amount(ctx.spend.weekly))}`;
    }
    const tone = refreshFailed ? "warn" : "good";
    byId("live-dot").className = `dot ${tone}`;
    byId("rail-dot").className = `dot ${tone}`;
    updateAge();
  }
  function showError(message) {
    const banner = byId("banner");
    if (!lastSuccess) byId("view").querySelector(".loading")?.remove();
    banner.textContent = message;
    banner.hidden = false;
  }
  async function refreshRoute() {
    const endpoint = routeEndpoint();
    if (endpoint === null || routeRequest?.endpoint === endpoint) return;
    const request = { endpoint };
    routeRequest = request;
    try {
      const value = await read(endpoint);
      if (routeRequest === request) routeResult = { endpoint, value };
    } catch (error) {
      if (routeRequest === request) {
        const value = routeResult?.endpoint === endpoint && error.status !== 404 ? routeResult.value : undefined;
        routeResult = { endpoint, value, error };
      }
    } finally {
      if (routeRequest === request) {
        routeRequest = undefined;
        if (routeEndpoint() === endpoint) render();
      }
    }
  }
  async function refresh() {
    void refreshRoute();
    try {
      const [digest, health, friction, linkedPrs, goals, daily, weekly, monthly] = await Promise.all([
        read("/v1/digest?window=13:00Z"),
        read("/v1/health/summary"),
        read("/v1/friction?status=open"),
        read("/v1/prs"),
        read("/v1/goals"),
        read("/v1/spend/summary?period=daily&source=semon"),
        read("/v1/spend/summary?period=weekly&source=semon"),
        read("/v1/spend/summary?period=monthly&source=semon"),
      ]);
      const now = Date.now();
      ctx = context({ digest, health, friction, linkedPrs, goals, spend: { daily, weekly, monthly } }, now);
      render();
      lastSuccess = now;
      refreshFailed = false;
      byId("banner").hidden = true;
    } catch (error) {
      refreshFailed = true;
      showError(`${lastSuccess ? "Stale data" : "Dashboard unavailable"}. ${error.message}`);
      if (!lastSuccess) byId("live").textContent = "Retrying in 8 seconds";
    } finally {
      updateStatus();
      setTimeout(refresh, refreshMs);
    }
  }

  const navItems = [...navigation(false), ...navigation(true)];
  for (const { link, mobile } of navItems) byId(mobile ? "tabbar" : "rail-nav").append(link);
  for (const node of document.querySelectorAll("[data-icon]")) node.append(icon(node.dataset.icon));
  window.addEventListener("hashchange", () => {
    render();
    if (token || proxyAuth) void refreshRoute();
    window.scrollTo(0, 0);
    byId("view").querySelector("h1")?.focus({ preventScroll: true });
  });
  render();
  if (token || proxyAuth) {
    if (route() !== "lane" && route() !== "report") byId("view").append(el("p", "Loading dashboard…", "muted loading"));
    void refresh();
    setInterval(updateAge, 1_000);
  } else {
    byId("live").textContent = "Dashboard unavailable";
    showError("Open the CLI’s dashboard URL with /preview before the token fragment.");
  }
</script>
</body>
</html>
