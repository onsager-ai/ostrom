<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ostrom Platform</title>
<style>
  :root {
    color-scheme: light dark;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    --radius: 8px;
    --radius-sm: 6px;
    --bg: oklch(99.2% 0 0);
    --card: #ffffff;
    --subtle: oklch(98.2% 0.001 286);
    --hover: oklch(96.4% 0.002 286);
    --fg: oklch(21% 0.006 285.885);
    --fg-secondary: oklch(37% 0.01 286);
    --muted: oklch(52% 0.014 286);
    --border: rgba(24, 24, 27, 0.09);
    --border-strong: rgba(24, 24, 27, 0.16);
    --primary: oklch(48.8% 0.217 264);
    --emerald: oklch(52% 0.14 163);
    --emerald-bg: rgba(16, 185, 129, 0.10);
    --emerald-bd: rgba(16, 185, 129, 0.24);
    --blue: oklch(52% 0.21 262);
    --blue-bg: rgba(59, 130, 246, 0.10);
    --blue-bd: rgba(59, 130, 246, 0.24);
    --amber: oklch(56% 0.16 58);
    --amber-bg: rgba(245, 158, 11, 0.12);
    --amber-bd: rgba(245, 158, 11, 0.28);
    --red: oklch(55% 0.22 27);
    --red-bg: rgba(239, 68, 68, 0.10);
    --red-bd: rgba(239, 68, 68, 0.24);
    --neutral-bg: rgba(113, 113, 122, 0.09);
    --neutral-bd: rgba(113, 113, 122, 0.20);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #09090b;
      --card: #111114;
      --subtle: #18181c;
      --hover: #1f1f24;
      --fg: #f4f4f6;
      --fg-secondary: #d4d4d8;
      --muted: #9898a3;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --primary: oklch(67.3% 0.182 276.9);
      --emerald: oklch(76.5% 0.177 163.2);
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --emerald-bd: rgba(16, 185, 129, 0.26);
      --blue: oklch(70.7% 0.165 254.6);
      --blue-bg: rgba(59, 130, 246, 0.14);
      --blue-bd: rgba(59, 130, 246, 0.28);
      --amber: oklch(82.8% 0.189 84.4);
      --amber-bg: rgba(245, 158, 11, 0.13);
      --amber-bd: rgba(245, 158, 11, 0.28);
      --red: oklch(70.4% 0.191 22.2);
      --red-bg: rgba(239, 68, 68, 0.13);
      --red-bd: rgba(239, 68, 68, 0.28);
      --neutral-bg: rgba(255, 255, 255, 0.06);
      --neutral-bd: rgba(255, 255, 255, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --card: #111114;
    --subtle: #18181c;
    --hover: #1f1f24;
    --fg: #f4f4f6;
    --fg-secondary: #d4d4d8;
    --muted: #9898a3;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.15);
    --primary: oklch(67.3% 0.182 276.9);
    --emerald: oklch(76.5% 0.177 163.2);
    --emerald-bg: rgba(16, 185, 129, 0.12);
    --emerald-bd: rgba(16, 185, 129, 0.26);
    --blue: oklch(70.7% 0.165 254.6);
    --blue-bg: rgba(59, 130, 246, 0.14);
    --blue-bd: rgba(59, 130, 246, 0.28);
    --amber: oklch(82.8% 0.189 84.4);
    --amber-bg: rgba(245, 158, 11, 0.13);
    --amber-bd: rgba(245, 158, 11, 0.28);
    --red: oklch(70.4% 0.191 22.2);
    --red-bg: rgba(239, 68, 68, 0.13);
    --red-bd: rgba(239, 68, 68, 0.28);
    --neutral-bg: rgba(255, 255, 255, 0.06);
    --neutral-bd: rgba(255, 255, 255, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }

  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-sans); -webkit-font-smoothing: antialiased; }
  .shell { max-width: 1200px; margin: 0 auto; padding: 16px 20px 28px; }

  /* Top toolbar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 28px; height: 28px; border-radius: 7px; background: var(--subtle);
    border: 1px solid var(--border-strong); display: grid; place-items: center; flex: none;
  }
  .brand-title { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .brand-sub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Theme segmented control */
  .seg {
    display: inline-flex; background: var(--subtle); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 2px; gap: 2px;
  }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--font-sans);
    padding: 5px 9px; border-radius: 4px; cursor: pointer;
  }
  .seg button.active { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }

  /* Status dot + pill badges */
  .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; flex: none; }
  .dot-ok { background: var(--emerald); }
  .dot-run { background: var(--blue); }
  .dot-warn { background: var(--amber); }
  .dot-err { background: var(--red); }
  .dot-muted { background: var(--muted); }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; font: 500 12px/1 var(--font-sans);
    padding: 4px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
  }
  .pill-ok { color: var(--emerald); background: var(--emerald-bg); border-color: var(--emerald-bd); }
  .pill-run { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-bd); }
  .pill-warn { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-bd); }
  .pill-err { color: var(--red); background: var(--red-bg); border-color: var(--red-bd); }
  .pill-neutral { color: var(--fg-secondary); background: var(--neutral-bg); border-color: var(--neutral-bd); }

  .mono {
    font-family: var(--font-mono); font-size: 12px; color: var(--fg-secondary);
    background: var(--subtle); border: 1px solid var(--border); border-radius: 5px;
    padding: 1px 6px; overflow-wrap: anywhere;
  }

  /* KPI strip */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow); min-width: 0;
  }
  .kpi-alert { border-color: var(--red-bd); background: linear-gradient(180deg, var(--red-bg), var(--card) 55%); }
  .kpi-warn { border-color: var(--amber-bd); background: linear-gradient(180deg, var(--amber-bg), var(--card) 55%); }
  .kpi-label { gap: 4px; flex-wrap: wrap; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .kpi-val { font-size: 22px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }

  /* Section grids */
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .grid-main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }

  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; min-width: 0;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--subtle);
  }
  .panel-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin: 0; display: flex; align-items: center; gap: 8px; }
  .panel-meta { font-size: 12px; color: var(--muted); }
  .panel-body { padding: 4px 14px 10px; }

  .row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: 0; padding-bottom: 4px; }
  .row-main { min-width: 0; flex: 1; }
  .row-title { font-size: 14px; font-weight: 550; color: var(--fg); margin: 0 0 3px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .row-desc { font-size: 13px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
  .row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; text-align: right; }
  .time-rel { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .empty {
    padding: 14px 2px 8px; color: var(--muted); font-size: 13px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }

  /* Host compact rows */
  .host-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center;
  }
  .host-row:last-child { border-bottom: 0; padding-bottom: 4px; }
  .host-name { font-size: 14px; font-weight: 550; display: flex; align-items: center; gap: 8px; }
  .host-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Collapsible digest */
  details.panel summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; background: var(--subtle); gap: 8px; flex-wrap: wrap;
  }
  details.panel summary::-webkit-details-marker { display: none; }
  .digest-tools { display: flex; align-items: center; gap: 8px; }
  select, .btn {
    font: 500 12px/1 var(--font-sans); color: var(--fg); background: var(--card);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 5px 9px; cursor: pointer;
  }
  .digest-body { padding: 12px 14px; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; color: var(--fg-secondary); margin: 0; }

  @media (max-width: 820px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-2, .grid-main { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 480px) {
    .shell { padding: 12px 12px 24px; }
    .row { flex-direction: column; gap: 6px; }
    .row-side { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; text-align: left; }
    .kpi-val { font-size: 20px; }
    .kpi-sub { white-space: normal; }
  }
  .row-title, .host-name, .host-meta, .digest-body { overflow-wrap: anywhere; }
  .host-name, .digest-tools { flex-wrap: wrap; }
  .host-status { align-self: start; }
  .row-desc + .row-desc { margin-top: 4px; }
  .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
  .connector-title { margin: 10px 0 0; font-size: 13px; }
  #error, .error-text { color: var(--red); }
  .warn-text { color: var(--amber); }
  .collapse-hint, details[open] .expand-hint { display: none; }
  details[open] .collapse-hint { display: inline; }
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="2" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
          <rect x="9" y="2" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
          <rect x="2" y="9" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
          <circle cx="11.5" cy="11.5" r="2.5" fill="var(--emerald)"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">Ostrom Platform</h1>
        <div class="brand-sub">
          <span id="live-dot" class="dot dot-muted" aria-hidden="true"></span>
          <span id="live" role="status">Loading…</span>
          <time id="refresh" hidden></time>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill pill-neutral"><span class="dot dot-ok"></span>Read-only</span>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme="auto" class="active" aria-pressed="true">Auto</button>
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </header>
  <p id="error" role="alert" hidden></p>
  <section id="kpis" class="kpis" aria-label="Summary"></section>

  <div class="grid-2">
    <section class="panel">
      <div class="panel-head"><h2 class="panel-title">Policy Alerts &amp; Friction</h2><span id="policy-meta"></span></div>
      <div class="panel-body" id="policy"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 class="panel-title">Decision Inbox</h2><span class="panel-meta" id="decisions-meta"></span></div>
      <div class="panel-body" id="decisions"></div>
    </section>
  </div>

  <div class="grid-main">
    <section class="panel">
      <div class="panel-head"><h2 class="panel-title">Active Runs, Waits &amp; PR Wakes</h2><span class="panel-meta" id="work-meta"></span></div>
      <div class="panel-body" id="work"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 class="panel-title">Host Health &amp; OAuth</h2><span class="panel-meta" id="hosts-meta"></span></div>
      <div class="panel-body" id="hosts"></div>
    </section>
  </div>

  <div class="grid-2">
    <section class="panel">
      <div class="panel-head"><h2 class="panel-title">Lanes &amp; Goals</h2><span class="panel-meta" id="lanes-meta"></span></div>
      <div class="panel-body" id="lanes"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 class="panel-title">GitHub PR CI &amp; Spend</h2><span class="panel-meta">Read-only connectors</span></div>
      <div class="panel-body">
        <h3 class="connector-title">GitHub PR CI</h3>
        <div id="github"></div>
        <h3 class="connector-title">Budgets &amp; Spend</h3>
        <div id="budgets"></div>
      </div>
    </section>
  </div>

  <details class="panel">
    <summary>
      <span class="panel-title">Owner Digest Preview</span>
      <span class="digest-tools">
        <label class="panel-meta" for="window">Window</label>
        <select id="window"><option>01:00Z</option><option>13:00Z</option><option>weekly</option></select>
        <button type="button" id="copy-digest" class="btn" disabled>Copy Markdown</button>
        <span class="panel-meta expand-hint">Expand ▾</span>
        <span class="panel-meta collapse-hint">Collapse ▴</span>
      </span>
    </summary>
    <pre id="digest" class="digest-body"></pre>
  </details>
</main>
<script type="module">
  const token = new URLSearchParams(location.hash.slice(1)).get("token");
  history.replaceState(null, "", location.pathname + location.search);

  const byId = (id) => document.getElementById(id);
  const element = (tag, text, className) => {
    const node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  };
  async function read(path) {
    const response = await fetch(path, {
      headers: { Authorization: `Bearer ${token}` }, cache: "no-store", signal: AbortSignal.timeout(10_000),
    });
    if (!response.ok) throw new Error(response.status === 401 ? "Open the dashboard URL printed by the CLI." : `Platform returned HTTP ${response.status}.`);
    return response.json();
  }

  function spendDetail(spend) {
    if (spend.status === "unavailable") return "Semon connector not enabled on this host";
    return `Estimated USD ${spend.usdEst ?? "unknown"} · Reported USD ${spend.sourceReportedUsd ?? "unknown"} · `
      + `Billed USD ${spend.billedUsd ?? "unknown"} · Coverage ${spend.coverage ?? "unknown"} · `
      + `${spend.unpricedCount} of ${spend.sessionCount} sessions unpriced · `
      + `${spend.unlinkedRunCount} unlinked runs · ${spend.missingSnapshotCount} runs missing a snapshot · `
      + `${spend.staleSnapshotCount} stale snapshots`;
  }

  const count = (n, singular, plural = `${singular}s`) => `${n} ${n === 1 ? singular : plural}`;
  const pill = (label, tone = "neutral") => element("span", label, `pill pill-${tone}`);
  const mono = (label) => element("code", label, "mono");
  const second = 1000;
  const minute = 60 * second;
  const hour = 60 * minute;
  const day = 24 * hour;

  function duration(ms) {
    if (ms >= day) return `${Math.floor(ms / day)}d`;
    if (ms >= hour) return `${Math.floor(ms / hour)}h`;
    if (ms >= minute) return `${Math.floor(ms / minute)} min`;
    return `${Math.floor(ms / second)}s`;
  }
  function parseTimestamp(iso) {
    const ms = typeof iso === "string" ? Date.parse(iso) : NaN;
    return Number.isFinite(ms) ? ms : null;
  }
  function relativeTime(iso) {
    const ms = parseTimestamp(iso);
    if (ms === null) return "unknown time";
    const elapsed = Date.now() - ms;
    return elapsed < second ? "just now" : `${duration(elapsed)} ago`;
  }
  function relativeExpiry(iso) {
    const ms = parseTimestamp(iso);
    if (ms === null) return "expiry unknown";
    const remaining = ms - Date.now();
    return remaining > 0 ? `expires in ${duration(remaining)}`
      : `expired ${relativeTime(iso)}`;
  }
  function timestamp(iso, format = relativeTime, prefix = "") {
    const node = element("time", iso ? prefix + format(iso) : "", "time-rel");
    if (iso) {
      node.dateTime = iso;
      node.title = iso;
    }
    return node;
  }

  function row(title, detail, { tags = [], badge, time } = {}) {
    const node = element("div", "", "row");
    const main = element("div", "", "row-main");
    const heading = element("div", title, "row-title");
    heading.append(...tags);
    main.append(heading);
    if (detail) main.append(element("p", detail, "row-desc"));
    node.append(main);
    if (badge || time) {
      const side = element("div", "", "row-side");
      if (badge) side.append(badge);
      if (time) side.append(time);
      node.append(side);
    }
    return { node, main };
  }
  function show(id, nodes, empty) {
    byId(id).replaceChildren(...(nodes.length ? nodes : [element("p", empty, "empty")]));
  }
  function kpi(label, value, detail, badge, highlight = "") {
    const tile = element("div", "", `kpi ${highlight}`);
    const heading = element("div", label, "kpi-label");
    heading.append(badge);
    const sub = element("div", "", "kpi-sub");
    sub.append(detail);
    tile.append(heading, element("div", value, "kpi-val"), sub);
    return tile;
  }
  async function copyText(button, value) {
    try {
      await navigator.clipboard.writeText(value);
      button.textContent = "Copied";
    } catch {
      button.textContent = "Copy failed";
    }
  }

  const hostTones = { connected: "ok", connecting: "run", stale: "warn", auth_expired: "err", disconnected: "err" };
  function summarizeHosts(hosts) {
    const now = Date.now();
    let connected = 0;
    let degraded = 0;
    let unknownExpiry = 0;
    let hostError = false;
    let soonestExpiry = null;
    let soonestMs = Infinity;
    for (const host of hosts) {
      const expiry = parseTimestamp(host.tokenExpiresAt);
      const expired = expiry !== null && expiry <= now;
      if (host.connectionState === "connected") connected++;
      if (host.connectionState !== "connected" || host.partialCoverage || expiry === null || expired) degraded++;
      if (expiry === null) unknownExpiry++;
      if (hostTones[host.connectionState] === "err" || expired) hostError = true;
      if (expiry !== null && expiry < soonestMs) {
        soonestMs = expiry;
        soonestExpiry = host.tokenExpiresAt;
      }
    }
    return { connected, degraded, unknownExpiry, hostError, soonestExpiry };
  }
  function renderHosts(hosts, agents) {
    const agentsByHost = new Map();
    for (const agent of agents) agentsByHost.set(agent.hostId, (agentsByHost.get(agent.hostId) ?? 0) + 1);
    show("hosts", hosts.map((host) => {
      const tone = hostTones[host.connectionState];
      const node = element("div", "", "host-row");
      const main = element("div", "", "row-main");
      const name = element("div", "", "host-name");
      name.append(element("span", "", `dot dot-${tone}`), element("span", host.label));
      if (host.serverVersion) name.append(mono(`v${host.serverVersion}`));
      const meta = element("div", count(agentsByHost.get(host.hostId) ?? 0, "agent") + " tracked", "host-meta");
      if (host.lastEventAt) meta.append(" · ", timestamp(host.lastEventAt, relativeTime, "event "));
      else if (host.lastReconciledAt) meta.append(" · ", timestamp(host.lastReconciledAt, relativeTime, "reconciled "));
      const expiry = element("div", "OAuth expiry unknown", "host-meta warn-text");
      const expiryMs = parseTimestamp(host.tokenExpiresAt);
      if (expiryMs !== null) {
        const time = timestamp(host.tokenExpiresAt, relativeExpiry, "OAuth ");
        const remaining = expiryMs - Date.now();
        expiry.classList.remove("warn-text");
        if (remaining <= 7 * day) time.classList.add(remaining <= 0 ? "error-text" : "warn-text");
        expiry.replaceChildren(time);
      } else if (host.tokenExpiresAt) expiry.title = host.tokenExpiresAt;
      main.append(name, meta, expiry);
      if (host.partialCoverage) main.append(element("p", "Partial coverage · reconciliation reached its thread limit", "row-desc"));
      if (host.lastError) main.append(element("p", host.lastError, "row-desc error-text"));
      const status = pill(host.connectionState, tone);
      status.classList.add("host-status");
      node.append(main, status);
      return node;
    }), "No hosts tracked.");
  }
  function isEchoedPolicyBreak(entry, alerts) {
    return entry.kind === "policy_break" && alerts.some((alert) =>
      alert.summary === entry.summary && (entry.ruleCode == null || entry.ruleCode === alert.ruleCode));
  }
  function wakeBadge(pr) {
    if (pr.state === "merged" || pr.lastWakeOutcome === "merged") return pill("merged");
    if (pr.lastWakeOutcome === "failed") return pill("failed", "err");
    if (pr.lastWakeOutcome === "completed") return pill("checks passed", "ok");
    return pill(pr.lastWakeOutcome ?? "woke");
  }
  function spendRow(title, spend) {
    const available = spend.status === "available";
    return row(title, spendDetail(spend), { badge: available ? pill("ok", "ok") : pill("unavailable", "warn") }).node;
  }

  function render({ digest, health, friction }) {
    const { decisions, lanes, policyAlerts, prs, githubPrs, spend, budgets } = digest.sections;
    const { agents, hosts, activeRuns, waits, pendingOwnerDecisions } = health;
    const idleCount = agents.filter((agent) => agent.status === "idle").length;
    const attention = pendingOwnerDecisions.length + waits.length;
    const alertCount = count(policyAlerts.length, "policy alert");
    const { connected, degraded, unknownExpiry, hostError, soonestExpiry } = summarizeHosts(hosts);
    const hostTone = hostError ? "err" : degraded ? "warn" : hosts.length ? "ok" : "neutral";
    byId("kpis").replaceChildren(
      kpi("Needs attention", attention, `${count(pendingOwnerDecisions.length, "owner decision")} · ${count(waits.length, "open wait")}`,
        pill(`${attention} open`, attention ? "warn" : "neutral"), attention ? "kpi-warn" : ""),
      kpi("Policy alerts", policyAlerts.length, policyAlerts.length ? `${alertCount} · ${policyAlerts[0].ruleCode}` : "All clear",
        policyAlerts.length ? pill("Active", "err") : pill("Clear"), policyAlerts.length ? "kpi-alert" : ""),
      kpi("Active runs", activeRuns.length, `${count(agents.length, "agent")} tracked · ${idleCount} idle`,
        activeRuns.length ? pill("Running", "run") : pill("Idle")),
      kpi("Host health", `${connected} / ${hosts.length}`, degraded
        ? `${degraded} degraded${unknownExpiry ? ` · ${unknownExpiry} with unknown OAuth expiry` : ""}`
        : soonestExpiry ? timestamp(soonestExpiry, relativeExpiry, "OAuth ")
        : "No hosts tracked",
        pill(hostError ? "Error" : degraded ? "Degraded" : hosts.length ? "Healthy" : "No hosts", hostTone)),
    );

    byId("policy-meta").replaceChildren(pill(alertCount, policyAlerts.length ? "err" : "neutral"));
    show("policy", [
      ...policyAlerts.map((alert) => row(alert.summary, "", {
        tags: [mono(alert.ruleCode)], badge: pill("Policy alert", "err"), time: timestamp(alert.createdAt),
      }).node),
      ...friction.filter((entry) => !isEchoedPolicyBreak(entry, policyAlerts)).map((entry) => row(entry.summary, "", {
        tags: [mono(entry.ruleCode ?? entry.kind)], badge: pill("Friction", "warn"), time: timestamp(entry.createdAt),
      }).node),
    ], "No open policy alerts or friction.");

    byId("decisions-meta").textContent = `${decisions.length} pending`;
    show("decisions", decisions.map((decision) => {
      const urgencyTone = decision.urgency === "incident" ? "err" : decision.urgency === "blocking_today" ? "warn" : "neutral";
      const { node, main } = row(decision.title, decision.recommendation, {
        tags: [pill(decision.urgency, urgencyTone), pill(decision.authority, decision.authority === "owner" ? "warn" : "neutral")],
        time: timestamp(decision.createdAt),
      });
      const actions = element("div", "", "row-actions");
      const copy = element("button", "Copy ID", "btn");
      copy.type = "button";
      copy.onclick = () => copyText(copy, decision.id);
      actions.append(mono(decision.id), copy);
      main.append(element("p", decision.category, "row-desc"), actions);
      return node;
    }), lanes.length === 0 ? "No lanes or decisions seeded yet on this host." : "No pending decisions.");

    const stalled = new Set(health.stalledRuns.map((run) => run.id));
    const labels = new Map(agents.map((agent) => [agent.id, agent.label]));
    byId("work-meta").textContent = `All ${count(hosts.length, "host")} · ${activeRuns.length} active · ${idleCount} idle`;
    show("work", [
      ...activeRuns.map((run) => row(labels.get(run.agentId) ?? run.externalRunRef, "", {
        tags: [mono(run.hostId)], badge: stalled.has(run.id) ? pill("stalled", "warn")
          : pill(run.status, run.status === "running" ? "run" : "warn"),
        time: run.startedAt ? timestamp(run.startedAt, relativeTime, "started ") : undefined,
      }).node),
      ...waits.map((wait) => row(wait.threadId,
        Array.isArray(wait.questions) && wait.questions.length
          ? wait.questions.map((item) => item.question).join(" · ") : wait.requestId, {
          tags: [mono(wait.hostId)], badge: pill(wait.kind === "approval" ? "Approval" : "User input", "warn"),
          time: timestamp(wait.occurredAt),
        }).node),
      ...prs.map((pr) => row(pr.repository, pr.lastWakeSummary, {
        tags: [mono(`#${pr.number}`), mono(pr.hostId)], badge: wakeBadge(pr), time: timestamp(pr.lastWakeAt),
      }).node),
    ], "No active runs, open waits, or PR wakes.");

    byId("hosts-meta").textContent = `${count(agents.length, "agent")} total`;
    renderHosts(hosts, agents);

    byId("lanes-meta").textContent = `${lanes.length} configured`;
    show("lanes", lanes.map(({ name, status, goal }) => {
      const statusTone = status === "active" ? "ok" : status === "paused" ? "warn" : "neutral";
      const { node, main } = row(name, goal?.statement ?? "No weekly goal", { badge: pill(status, statusTone) });
      if (goal) {
        const progress = `${goal.metricCurrent ?? "unknown"}/${goal.metricTarget}`;
        main.append(element("p", `${goal.metricName} · ${progress}${goal.metricUnit ? " " + goal.metricUnit : ""}`, "row-desc"));
        const approval = element("div", "", "row-actions");
        approval.append(goal.approvedDecisionId ? mono(goal.approvedDecisionId) : pill("unapproved"));
        main.append(approval);
      }
      return node;
    }), "No lanes seeded yet on this host.");

    const ciTones = { success: "ok", failure: "err", error: "err", pending: "warn" };
    byId("github").replaceChildren(...(githubPrs.length ? githubPrs.map((pr) => row(pr.repository,
      `${pr.failedChecks}/${pr.totalChecks} failed · ${count(pr.consecutiveFailures, "consecutive failing head")}`, {
        tags: [mono(`#${pr.number}`)], badge: pill(pr.rollupState, ciTones[pr.rollupState]),
        time: timestamp(pr.lastCheckedAt, relativeTime, "checked "),
      }).node) : [row("No open watched PRs checked yet", "", { badge: pill("idle") }).node]));
    byId("budgets").replaceChildren(
      spendRow("Team monthly", spend),
      ...budgets.map((budget) => spendRow(
        `${budget.scopeKind}${budget.scopeId ? " " + budget.scopeId : ""} · ${budget.period} cap USD ${budget.capUsd}${budget.enabled ? "" : " · disabled"}`, budget.spend)),
    );

    byId("digest").textContent = digest.markdown;
    byId("copy-digest").disabled = false;
  }

  const themeButtons = [...document.querySelectorAll(".seg button")];
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    for (const button of themeButtons) {
      const active = button.dataset.theme === theme;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    }
  }
  try {
    const saved = localStorage.getItem("ostrom-platform-theme");
    if (themeButtons.some((button) => button.dataset.theme === saved)) setTheme(saved);
  } catch {
    // The switch still works if storage is blocked.
  }
  for (const button of themeButtons) {
    button.onclick = () => {
      setTheme(button.dataset.theme);
      try {
        localStorage.setItem("ostrom-platform-theme", button.dataset.theme);
      } catch {
        // The current page has already applied the theme.
      }
    };
  }

  const windowSelect = byId("window");
  const refreshTime = byId("refresh");
  let timer;
  let latestRequest = 0;
  function updateRefreshTime() {
    if (refreshTime.dateTime) refreshTime.textContent = `Updated ${relativeTime(refreshTime.dateTime)}`;
  }
  async function refresh() {
    clearTimeout(timer);
    const requestId = ++latestRequest;
    try {
      const requests = await Promise.allSettled([
        read(`/v1/digest?window=${encodeURIComponent(windowSelect.value)}`),
        read("/v1/health/summary"),
        read("/v1/friction?status=open"),
      ]);
      if (requestId !== latestRequest) return;
      for (const response of requests) if (response.status === "rejected") throw response.reason;
      const [digest, health, friction] = requests;
      render({ digest: digest.value, health: health.value, friction: friction.value });
      byId("error").hidden = true;
      byId("live").textContent = `Live · ${health.value.hosts.filter((host) => host.connectionState === "connected").length} of ${health.value.hosts.length} hosts connected`;
      byId("live-dot").className = "dot dot-ok";
      refreshTime.dateTime = new Date().toISOString();
      refreshTime.title = refreshTime.dateTime;
      refreshTime.hidden = false;
      updateRefreshTime();
    } catch (error) {
      if (requestId !== latestRequest) return;
      const label = byId("error");
      label.textContent = `${refreshTime.dateTime ? "Stale data" : "Dashboard unavailable"}. ${error.message}`;
      label.hidden = false;
      byId("live").textContent = "Retrying in 5 seconds";
      byId("live-dot").className = "dot dot-warn";
    } finally {
      if (requestId === latestRequest) timer = setTimeout(refresh, 5000);
    }
  }
  windowSelect.onclick = (event) => event.stopPropagation();
  windowSelect.onchange = () => {
    if (!token) return;
    byId("copy-digest").disabled = true;
    byId("copy-digest").textContent = "Copy Markdown";
    byId("digest").textContent = "Loading digest…";
    void refresh();
  };
  byId("copy-digest").onclick = (event) => {
    event.preventDefault();
    event.stopPropagation();
    void copyText(event.currentTarget, byId("digest").textContent);
  };
  if (token) {
    void refresh();
    setInterval(updateRefreshTime, 1000);
  } else {
    byId("error").textContent = "Open the dashboard URL printed by the CLI.";
    byId("error").hidden = false;
    byId("live").textContent = "Dashboard unavailable";
  }
</script>
</body>
</html>
