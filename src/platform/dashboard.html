<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ostrom Platform</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fcfcfd, #09090b);
    --card: light-dark(#fff, #111114);
    --subtle: light-dark(#f4f4f5, #1c1c20);
    --fg: light-dark(#18181b, #f4f4f5);
    --muted: light-dark(#52525b, #a1a1aa);
    --border: light-dark(#18181b1a, #ffffff14);
    --focus: light-dark(#4338ca, #b5a8ff);
    --ok: light-dark(#166534, #86efac);
    --ok-bg: light-dark(#dcfce7, #142b21);
    --warn: light-dark(#854d0e, #fde68a);
    --warn-bg: light-dark(#fef3c7, #332615);
    --err: light-dark(#991b1b, #fca5a5);
    --err-bg: light-dark(#fee2e2, #362025);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; min-width: 0; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .shell { max-width: 880px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 28px; }
  h1, h2, p { margin: 0; }
  h1 { font-size: 23px; letter-spacing: -.025em; }
  h2 { font-size: 17px; font-weight: 650; letter-spacing: -.012em; }
  .topbar, .controls, .live-status, .detail-heading, .row-heading, .row-actions, .digest-tools {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 10px;
  }
  .topbar { justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .controls { gap: 6px; }
  .live-status, .row-detail, time, .empty { color: var(--muted); font-size: 15px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot-ok { background: var(--ok); }
  .dot-warn { background: var(--warn); }

  button, select, .button, .t3-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--fg);
    font: inherit;
    font-size: 15px;
    font-weight: 550;
    text-decoration: none;
    cursor: pointer;
  }
  button:hover, .button:hover, .t3-link:hover, .row-link:hover { background: var(--subtle); }
  button:disabled { color: var(--muted); cursor: default; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .seg { display: flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 7px 0 0 7px; }
  .seg button:last-child { border-radius: 0 7px 7px 0; }
  .seg button + button { margin-left: -1px; }
  .seg button:focus-visible { z-index: 1; }
  .seg button[aria-pressed="true"] { background: var(--subtle); color: var(--focus); }

  .section { margin-top: 14px; }
  .section > h2 { margin-bottom: 5px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  .row, .empty {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 2px 10px;
    padding: 6px 12px;
  }
  .row + .row, .row + details, .row + .more, details > .row { border-top: 1px solid var(--border); }
  .lane-row + .lane-row, .lane-toggle { border-top: 1px solid var(--border); }
  .row-title { font-weight: 650; }
  .row-detail { margin-top: 2px; }
  .board-recommendation {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .row-actions { justify-content: flex-end; }
  .pill {
    padding: 0 7px;
    border-radius: 999px;
    background: var(--subtle);
    color: var(--muted);
    font-size: 15px;
    font-weight: 550;
  }
  .pill-ok { color: var(--ok); background: var(--ok-bg); }
  .pill-warn { color: var(--warn); background: var(--warn-bg); }
  .pill-err { color: var(--err); background: var(--err-bg); }
  .t3-link { color: var(--focus); white-space: nowrap; }
  .row-link { min-height: 44px; color: inherit; text-decoration: none; border-radius: 7px; }
  .row-arrow { color: var(--focus); }
  .lane-row { display: grid; }
  .lane-row > .row { grid-area: 1 / 1; min-height: 44px; padding-right: 74px; }
  .lane-row > .row-link { padding-right: 12px; }
  .lane-row .row-arrow { margin-left: 62px; }
  .lane-details {
    grid-area: 1 / 1;
    place-self: center end;
    z-index: 1;
    margin-right: 8px;
    min-height: 32px;
    padding-inline: 6px;
    color: var(--focus);
  }
  .row-link + .lane-details { margin-right: 29px; }
  .lane-toggle { padding: 4px 12px; }
  .more { padding: 3px 12px; color: var(--focus); }
  .empty { display: block; padding-block: 8px; }
  .error { margin-top: 10px; color: var(--err); }

  .spend { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding: 8px 12px; }
  .meter-track { flex: 1 1 80px; height: 6px; background: var(--subtle); border-radius: 5px; }
  progress { display: block; width: 100%; height: 100%; border: 0; appearance: none; accent-color: var(--ok); }
  progress::-webkit-progress-bar { background: var(--subtle); border-radius: 5px; }
  progress::-webkit-progress-value { background: var(--ok); border-radius: 5px; }
  progress::-moz-progress-bar { background: var(--ok); border-radius: 5px; }

  .back { margin-top: 10px; }
  .detail-heading { margin-top: 8px; }
  .detail-heading .t3-link { margin-left: auto; }
  .goal { padding: 10px 12px; }
  .goal p + p { margin-top: 4px; }
  .goal ul { margin: 6px 0 0; padding-left: 24px; }
  .nav-link { color: var(--focus); }
  summary { display: list-item; min-height: 44px; padding: 10px 12px; cursor: pointer; font-weight: 650; }
  .digest-tools { padding: 6px 12px; border-top: 1px solid var(--border); }
  pre { margin: 0; padding: 10px 12px; white-space: pre-wrap; font-size: 15px; overflow-wrap: anywhere; }

  @media (max-width: 520px) {
    .topbar { align-items: flex-start; gap: 5px 10px; }
    .live-status { order: 1; flex-basis: 100%; }
    .row:not(.row-link) { grid-template-columns: 1fr; }
    .row-actions { justify-content: flex-start; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <h1>Ostrom</h1>
    <div class="live-status"><span class="dot" id="live-dot"></span><span id="live">Connecting…</span></div>
    <div class="controls">
      <a class="button" href="#system">System</a>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme="auto" aria-pressed="true">Auto</button>
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </header>
  <p id="error" class="error" role="alert" hidden></p>
  <div id="view"></div>
  <details class="panel section" id="owner-digest" hidden>
    <summary>Owner Digest</summary>
    <div class="digest-tools">
      <label for="window">Window</label>
      <select id="window"><option>01:00Z</option><option>13:00Z</option><option>weekly</option></select>
      <button type="button" id="copy-digest" disabled>Copy Markdown</button>
    </div>
    <pre id="digest"></pre>
  </details>
</main>
<script type="module">
  const proxyAuth = document.documentElement.dataset.auth === "proxy";
  const tokenFragment = location.hash.startsWith("#token=");
  const token = !proxyAuth && tokenFragment ? new URLSearchParams(location.hash.slice(1)).get("token") : null;
  if (tokenFragment) history.replaceState(null, "", location.pathname + location.search);

  const byId = (id) => document.getElementById(id);
  const element = (tag, text = "", className = "") => {
    const node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  };
  async function read(path) {
    const response = await fetch(path, {
      headers: proxyAuth ? {} : { Authorization: `Bearer ${token}` }, cache: "no-store", signal: AbortSignal.timeout(10_000),
    });
    if (proxyAuth && (response.status === 401 || response.status === 403)) throw new Error("Dashboard authorization failed.");
    if (!response.ok) throw new Error(response.status === 401 ? "Open the dashboard URL printed by the CLI." : `Platform returned HTTP ${response.status}.`);
    return response.json();
  }

  function encodeT3Segment(value) {
    return encodeURIComponent(value).replace(/[.!~*'()]/g, (c) => "%" + c.charCodeAt(0).toString(16).toUpperCase());
  }
  function hostWebOrigin(host) {
    if (/^https:\/\/[^/?#@\\\s\p{Cc}]+\/?$/u.test(host?.webUrl ?? "")) {
      const web = URL.parse(host.webUrl);
      if (web?.protocol === "https:" && web.href === `${web.origin}/`) return web.origin;
    }
    if (!/^https:\/\//i.test(host?.mcpUrl ?? "")) return null;
    const mcp = URL.parse(host.mcpUrl);
    return mcp?.protocol === "https:" ? mcp.origin : null;
  }
  function t3ThreadUrl(host, environmentId, threadId) {
    const origin = hostWebOrigin(host);
    return origin && typeof environmentId === "string" && environmentId && typeof threadId === "string" && threadId
      ? `${origin}/threads/${encodeT3Segment(environmentId)}/${encodeT3Segment(threadId)}` : null;
  }
  function agentThreadUrl(agent, hostsById) {
    const ref = agent?.externalRef ?? "";
    const slash = ref.indexOf("/");
    return slash < 0 ? null : t3ThreadUrl(hostsById.get(agent.hostId), ref.slice(0, slash), ref.slice(slash + 1));
  }
  function laneThreadUrl(lane, agentsById, hostsById) {
    return agentThreadUrl(agentsById.get(lane?.ownerAgentId), hostsById);
  }
  function threadUrlFromEvidence(detail, { hostsById }) {
    const { hostId, environmentId, threadId } = detail;
    if (!environmentId || !threadId) return null;
    const host = hostsById.get(hostId) ?? [...hostsById.values()].find((item) => item.environmentId === environmentId);
    return t3ThreadUrl(host, environmentId, threadId);
  }
  function decisionThreadUrl(decision, ctx) {
    const { agentsById, hostsById, lanesById } = ctx;
    const entries = [decision.evidence];
    while (entries.length) {
      const item = entries.pop();
      let href;
      if (typeof item === "string") {
        const match = /^t3-thread:\/\/v2\/([^/]+)\/(.+)$/.exec(item);
        if (match) href = threadUrlFromEvidence({ environmentId: match[1], threadId: match[2] }, ctx);
      } else if (item && typeof item === "object") {
        href = threadUrlFromEvidence(item, ctx) ?? agentThreadUrl(agentsById.get(item.agentId), hostsById);
        if (!href) for (const value of Object.values(item).reverse()) entries.push(value);
      }
      if (href) return href;
    }
    const requester = decision.requestedBy?.toLowerCase();
    return laneThreadUrl(lanesById.get(decision.laneId), agentsById, hostsById)
      ?? agentThreadUrl(agentsById.get(decision.requestedBy)
        ?? [...agentsById.values()].find((agent) => agent.label.toLowerCase() === requester), hostsById);
  }
  function repositoryLane(repository, { lanesBySlug }) {
    const basename = typeof repository === "string" ? repository.split("/").at(-1).toLowerCase() : "";
    const aliases = { "agent-workbench": "awb", "crawlab-pro": "crawlab" };
    return lanesBySlug.get(basename) ?? lanesBySlug.get(aliases[basename]);
  }
  function alertLane(alert, ctx) {
    const agentId = alert.detail?.agentId;
    return ctx.lanesById.get(alert.laneId)
      ?? (agentId ? [...ctx.lanesById.values()].find((lane) => lane.ownerAgentId === agentId) : undefined)
      ?? repositoryLane(alert.detail?.repository, ctx);
  }
  function alertThreadUrl(alert, ctx) {
    const { agentsById, hostsById } = ctx;
    return agentThreadUrl(agentsById.get(alert.detail?.agentId), hostsById)
      ?? threadUrlFromEvidence(alert.detail ?? {}, ctx)
      ?? laneThreadUrl(alertLane(alert, ctx), agentsById, hostsById);
  }
  function t3Link(href, text = "Open in T3 ↗", className = "t3-link") {
    if (!href?.startsWith("https://")) return null;
    const link = element("a", text, className);
    link.href = href;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.onclick = (event) => event.stopPropagation();
    return link;
  }

  function duration(ms) {
    if (ms >= 86_400_000) return `${Math.floor(ms / 86_400_000)}d`;
    if (ms >= 3_600_000) return `${Math.floor(ms / 3_600_000)}h`;
    if (ms >= 60_000) return `${Math.floor(ms / 60_000)} min`;
    return `${Math.floor(ms / 1000)}s`;
  }
  function relativeTime(iso) {
    const elapsed = Date.now() - Date.parse(iso);
    if (!Number.isFinite(elapsed)) return "unknown time";
    return elapsed < 1000 ? "just now" : `${duration(elapsed)} ago`;
  }
  function relativeExpiry(iso) {
    const remaining = Date.parse(iso) - Date.now();
    if (!Number.isFinite(remaining)) return "expiry unknown";
    return remaining > 0 ? `expires in ${duration(remaining)}` : `expired ${relativeTime(iso)}`;
  }
  function timestamp(iso, format = relativeTime, prefix = "") {
    const node = element("time", prefix + format(iso));
    node.dateTime = iso;
    node.title = iso;
    return node;
  }

  const pill = (label, tone = "") => element("span", label, tone ? `pill pill-${tone}` : "pill");
  function row(title, detail, { tags = [], actions = [], compact = false, href } = {}) {
    const link = t3Link(href, "", "row row-link");
    const node = link ?? element("div", "", "row");
    const main = element("div");
    const heading = element("div", "", "row-heading");
    heading.append(element("span", title, "row-title"), ...tags);
    main.append(heading);
    if (detail) main.append(element("p", detail, compact ? "row-detail board-recommendation" : "row-detail"));
    node.append(main);
    if (link) {
      const arrow = element("span", "↗", "row-arrow");
      arrow.setAttribute("aria-hidden", "true");
      link.append(arrow);
    }
    const controls = actions.filter(Boolean);
    if (controls.length) {
      const side = element("div", "", "row-actions");
      side.append(...controls);
      node.append(side);
    }
    return node;
  }
  function section(title, nodes, empty) {
    const node = element("section", "", "section");
    const panel = element("div", "", "panel");
    panel.append(...(nodes.length ? nodes : [element("p", empty, "empty")]));
    node.append(element("h2", title), panel);
    return node;
  }
  function navLink(text, href, className = "button") {
    const link = element("a", text, className);
    link.href = href;
    return link;
  }

  const urgencyRank = { incident: 0, blocking_today: 1, digest: 2 };
  const urgencyLabel = { incident: "Incident", blocking_today: "Blocking today", digest: "Digest" };
  const newestFirst = (a, b) => b.createdAt.localeCompare(a.createdAt);
  const sortOwnerDecisions = (decisions) => [...decisions].sort((a, b) =>
    urgencyRank[a.urgency] - urgencyRank[b.urgency] || newestFirst(a, b));
  function policySeverity({ ruleCode, detail }) {
    return ruleCode === "pr_green_ci" || ruleCode === "budget_warning"
      || (ruleCode === "budget_cap" && detail?.level === "warning") ? "warn" : "err";
  }
  const sortAlerts = (alerts) => [...alerts].sort((a, b) =>
    Number(policySeverity(a) === "warn") - Number(policySeverity(b) === "warn") || newestFirst(a, b));
  function decisionRow(decision, ctx, compact) {
    const tags = [pill(urgencyLabel[decision.urgency], { incident: "err", blocking_today: "warn" }[decision.urgency])];
    const lane = ctx.lanesById.get(decision.laneId);
    if (lane) tags.push(pill(lane.name));
    const href = decisionThreadUrl(decision, ctx);
    return row(decision.title, decision.recommendation, compact ? { tags, compact, href } : { tags, actions: [t3Link(href)] });
  }
  function alertRow(alert, ctx, compact) {
    const severity = policySeverity(alert);
    const tags = [pill(severity === "err" ? "Critical" : "Warning", severity), timestamp(alert.createdAt)];
    const href = alertThreadUrl(alert, ctx);
    return row(alert.summary, "", compact ? { tags, href } : { tags, actions: [t3Link(href)] });
  }
  function topRows(items, buildRow, label) {
    const nodes = items.slice(0, 3).map(buildRow);
    if (items.length > 3) nodes.push(navLink(`View all ${items.length} ${label} →`, "#system", "button more"));
    return nodes;
  }

  const firstText = (...values) => values.find((value) => typeof value === "string" && value.trim())?.trim();
  function planItem(item) {
    if (typeof item === "string") return firstText(item);
    return firstText(item?.title, item?.summary, item?.text, item?.nextStep, item?.next);
  }
  function laneSummary(lane, ctx) {
    const manager = ctx.agentsById.get(lane.ownerAgentId);
    const decisions = ctx.decisionsByLane.get(lane.id) ?? [];
    const alerts = ctx.alertsByLane.get(lane.id) ?? [];
    const plan = lane.goal?.weeklyPlan;
    const first = Array.isArray(plan) ? plan[0] : plan;
    const managerStatus = !manager || manager.status === "active" ? "active" : manager.status === "waiting" ? "waiting" : "idle";
    const status = decisions.length || alerts.length ? "blocked" : lane.status === "paused" ? "paused" : managerStatus;
    const next = firstText(first?.nextStep, first?.next, Array.isArray(plan) ? planItem(first) : null);
    const blockers = Array.isArray(first?.blockers) ? first.blockers : [first?.blockers];
    const blocker = firstText(planItem(first?.blocker), ...blockers.map(planItem), decisions[0]?.title, alerts[0]?.summary);
    return { status, next, blocker };
  }
  function summarizeLaneLine2({ next, blocker }) {
    return [next && `Next: ${next}`, blocker && `Blocker: ${blocker}`].filter(Boolean).join(" · ");
  }
  const statePill = (status) => pill(status, { active: "ok", blocked: "err", paused: "warn", waiting: "warn" }[status]);
  function laneRow(lane, ctx) {
    const summary = laneSummary(lane, ctx);
    const tags = [statePill(summary.status)];
    if (lane.goal?.statement) tags.push(element("span", lane.goal.statement, "row-detail"));
    const href = laneThreadUrl(lane, ctx.agentsById, ctx.hostsById);
    const node = element("div", "", "lane-row");
    const main = row(lane.name, summarizeLaneLine2(summary), { tags, href });
    const button = element("button", "Details", "lane-details");
    button.type = "button";
    button.setAttribute("aria-label", `Details for ${lane.name}`);
    button.dataset.focusKey = `lane:${lane.id}`;
    button.onclick = (event) => {
      event.preventDefault();
      event.stopPropagation();
      location.hash = `lane/${encodeURIComponent(lane.slug)}`;
    };
    node.append(main, button);
    return node;
  }

  const money = (amount) => amount.toLocaleString("en-US", { maximumFractionDigits: 2 });
  const spendUnavailable = "Unavailable · Semon not enabled on this host";
  function spendMeter({ budgets, spend }) {
    const budget = budgets.find((item) => item.enabled && item.scopeKind === "team" && item.period === "monthly");
    const summary = budget?.spend ?? spend;
    const cap = budget?.capUsd;
    const amount = summary.status === "available" ? summary.preferredUsd : null;
    const readout = amount == null ? (summary.status === "unavailable" ? spendUnavailable : "Unavailable · No priced sessions")
      : cap == null ? `USD ${money(amount)} estimated` : `USD ${money(amount)} / ${money(cap)} monthly`;
    const node = element("section", "", "panel section spend");
    const track = element("div", "", "meter-track");
    if (amount != null && cap > 0) {
      const meter = element("progress");
      meter.max = cap;
      meter.value = Math.min(amount, cap);
      meter.setAttribute("aria-label", readout);
      track.append(meter);
    }
    node.append(element("h2", "Spend"), track, element("span", readout, "row-detail"));
    return node;
  }
  function partitionBoardLanes(lanes, ctx) {
    const activeLaneIds = new Set();
    const activeAgentIds = new Set();
    for (const run of [...ctx.health.activeRuns, ...ctx.health.stalledRuns]) {
      activeLaneIds.add(run.laneId);
      activeLaneIds.add(ctx.agentsById.get(run.agentId)?.laneId);
      activeAgentIds.add(run.agentId);
    }
    const visible = [];
    const hidden = [];
    for (const lane of lanes) {
      const managerStatus = ctx.agentsById.get(lane.ownerAgentId)?.status;
      const summary = laneSummary(lane, ctx);
      const busy = lane.status !== "paused" && (managerStatus === "active" || managerStatus === "waiting"
        || activeLaneIds.has(lane.id) || (lane.ownerAgentId != null && activeAgentIds.has(lane.ownerAgentId)));
      (busy || summary.status === "blocked" || summary.blocker ? visible : hidden).push(lane);
    }
    return { visible, hidden };
  }
  let showAllLanes = false;
  function laneBoard(ctx) {
    const { visible, hidden } = partitionBoardLanes(ctx.lanes, ctx);
    const lanes = (showAllLanes ? ctx.lanes : visible).map((lane) => laneRow(lane, ctx));
    if (!showAllLanes && !visible.length && hidden.length) {
      lanes.push(element("p", "All lanes are idle with no blockers", "empty"));
    }
    if (hidden.length) {
      const toggle = element("button", showAllLanes ? "Hide idle lanes"
        : visible.length ? `Show all lanes (${hidden.length} hidden)` : `Show all lanes (${hidden.length})`);
      toggle.type = "button";
      toggle.dataset.focusKey = "toggle-lanes";
      toggle.setAttribute("aria-expanded", String(showAllLanes));
      toggle.onclick = () => {
        showAllLanes = !showAllLanes;
        renderView();
      };
      const controls = element("div", "", "lane-toggle");
      controls.append(toggle);
      lanes.push(controls);
    }
    return [
      section("Waiting on you", topRows(ctx.decisions, (item) => decisionRow(item, ctx, true), "waiting on you"), "Nothing waiting on you"),
      section("Alerts", topRows(ctx.alerts, (item) => alertRow(item, ctx, true), "alerts"), "No active alerts"),
      section("Lanes", lanes, "No lanes seeded yet on this host."),
      spendMeter(ctx.health),
    ];
  }

  function goalPanel(lane, summary) {
    const { goal } = lane;
    const panel = element("div", "", "goal");
    if (goal) {
      panel.append(element("p", goal.statement));
      if (goal.metricName.trim().toLowerCase() !== "unknown") {
        panel.append(element("p", `${goal.metricName} · ${goal.metricCurrent ?? "unknown"}/${goal.metricTarget}${goal.metricUnit ? " " + goal.metricUnit : ""}`, "row-detail"));
      }
      panel.append(element("p", `Week of ${goal.weekStart} · ${goal.approvedDecisionId ? "Approved" : "Unapproved"}`, "row-detail"));
    } else {
      panel.append(element("p", "No weekly goal"));
    }
    if (summary.next) panel.append(element("p", `Next: ${summary.next}`));
    if (summary.blocker) panel.append(element("p", `Blocker: ${summary.blocker}`));
    const plan = goal?.weeklyPlan;
    const items = Array.isArray(plan) ? plan : plan?.items ?? plan?.steps ?? plan?.tasks;
    if (Array.isArray(items) && items.length) {
      const list = element("ul");
      list.append(...items.map((item) => element("li", planItem(item) ?? JSON.stringify(item))));
      panel.append(list);
    }
    return panel;
  }

  const hostTones = { connected: "ok", connecting: "", stale: "warn", auth_expired: "err", disconnected: "err" };
  function hostRows({ hosts, agents }) {
    const counts = new Map();
    for (const { hostId } of agents) counts.set(hostId, (counts.get(hostId) ?? 0) + 1);
    return hosts.map((host) => {
      const tags = [pill(host.connectionState, hostTones[host.connectionState])];
      if (host.serverVersion) tags.push(element("span", `v${host.serverVersion}`, "row-detail"));
      const node = row(host.label, "", { tags });
      const n = counts.get(host.hostId) ?? 0;
      node.firstChild.append(element("span", `${n} ${n === 1 ? "agent" : "agents"} · `, "row-detail"),
        timestamp(host.tokenExpiresAt, relativeExpiry, "OAuth "));
      if (host.partialCoverage) node.firstChild.append(element("p", "Partial coverage · reconciliation reached its thread limit", "row-detail"));
      if (host.lastError) node.firstChild.append(element("p", host.lastError, "error"));
      return node;
    });
  }
  function agentRow(agent, ctx, ownerId) {
    return row(agent.label, ctx.hostsById.get(agent.hostId)?.label, {
      tags: [pill(agent.id === ownerId ? "Lane owner" : agent.role.replaceAll("_", " ")), pill(agent.status)],
      actions: [t3Link(agentThreadUrl(agent, ctx.hostsById))],
    });
  }
  function runRow(run, ctx) {
    const agent = ctx.agentsById.get(run.agentId);
    const status = ctx.stalledIds.has(run.id) ? "stalled" : run.status;
    const tags = [pill(status.replaceAll("_", " "), status === "running" ? "ok" : "warn")];
    if (run.startedAt) tags.push(timestamp(run.startedAt, relativeTime, "started "));
    return row(agent?.label ?? run.externalRunRef, run.model, {
      tags, actions: [t3Link(agentThreadUrl(agent, ctx.hostsById))],
    });
  }
  function waitRow(wait, ctx) {
    const host = ctx.hostsById.get(wait.hostId);
    const questions = Array.isArray(wait.questions) ? wait.questions.map((item) => item?.question ?? item).join(" · ") : "";
    return row(wait.threadId, questions || host?.label, {
      tags: [pill(wait.kind === "approval" ? "Approval" : "User input", "warn"), timestamp(wait.occurredAt)],
      actions: [t3Link(t3ThreadUrl(host, host?.environmentId, wait.threadId))],
    });
  }

  const githubPrKey = ({ repository, number }) => `${repository.toLowerCase()}#${number}`;
  function githubPrs(checks, linked) {
    const byKey = new Map(checks.map((check) => [githubPrKey(check), check]));
    for (const pr of linked) {
      if (pr.prHost.toLowerCase() !== "github.com") continue;
      const key = githubPrKey(pr);
      const check = byKey.get(key);
      byKey.set(key, {
        ...pr, ...check, title: pr.title ?? check?.title,
        rollupState: pr.state === "closed" || pr.state === "merged" ? "closed" : check?.rollupState ?? "unchecked",
      });
    }
    return [...byKey.values()];
  }
  function partitionGithubPrs(prs) {
    const rank = { failure: 0, error: 0, pending: 1, unchecked: 2, success: 3 };
    return {
      open: prs.filter((pr) => pr.rollupState !== "closed" && !pr.isDraft).sort((a, b) =>
        rank[a.rollupState] - rank[b.rollupState] || a.repository.localeCompare(b.repository) || a.number - b.number),
      folded: prs.filter((pr) => pr.rollupState === "closed" || pr.isDraft),
    };
  }
  const prDisclosureOpen = new Map();
  function prRows(prs, viewKey) {
    const { open, folded } = partitionGithubPrs(prs);
    const tones = { success: "ok", failure: "err", error: "err", pending: "warn" };
    const prRow = (pr) => {
      const tags = [pill(pr.rollupState, pr.isDraft ? "" : tones[pr.rollupState])];
      if (pr.isDraft) tags.unshift(pill("draft"));
      if (pr.lastCheckedAt) tags.push(timestamp(pr.lastCheckedAt, relativeTime, "checked "));
      const checks = pr.totalChecks == null ? "" : `${pr.failedChecks}/${pr.totalChecks} checks failed`;
      return row(`${pr.repository} #${pr.number}${pr.title ? " · " + pr.title : ""}`, checks, { tags });
    };
    const nodes = open.map(prRow);
    if (folded.length) {
      const disclosure = element("details");
      disclosure.dataset.prKey = viewKey;
      disclosure.open = prDisclosureOpen.get(viewKey) ?? false;
      const hasDraft = folded.some((pr) => pr.isDraft && pr.rollupState !== "closed");
      const hasClosed = folded.some((pr) => pr.rollupState === "closed");
      const label = hasDraft ? hasClosed ? "Closed and draft PRs" : "Draft PRs" : "Closed PRs";
      const summary = element("summary", `${label} (${folded.length})`);
      summary.dataset.focusKey = `prs:${viewKey}`;
      disclosure.append(summary, ...folded.map(prRow));
      nodes.push(disclosure);
    }
    return nodes;
  }
  function frictionRows(entries) {
    return entries.map((entry) => row(entry.summary, "", {
      tags: [pill(entry.kind.replaceAll("_", " ")), timestamp(entry.createdAt)],
    }));
  }
  function spendRow(title, spend) {
    const detail = spend.status === "unavailable" ? spendUnavailable
      : `Estimated USD ${spend.usdEst ?? "unknown"} · Reported USD ${spend.sourceReportedUsd ?? "unknown"} · `
      + `Billed USD ${spend.billedUsd ?? "unknown"} · Coverage ${spend.coverage ?? "unknown"} · `
      + `${spend.unpricedCount} of ${spend.sessionCount} sessions unpriced · ${spend.unlinkedRunCount} unlinked runs · `
      + `${spend.missingSnapshotCount} runs missing a snapshot · ${spend.staleSnapshotCount} stale snapshots`;
    return row(title, detail);
  }

  const backLink = () => navLink("← Lane Board", "#", "button back");
  function laneView(lane, ctx, viewKey) {
    if (!lane) return [backLink(), element("p", "Lane unavailable", "error")];
    const manager = ctx.agentsById.get(lane.ownerAgentId);
    const decisions = ctx.decisionsByLane.get(lane.id) ?? [];
    const alerts = ctx.alertsByLane.get(lane.id) ?? [];
    const summary = laneSummary(lane, ctx);
    const heading = element("div", "", "detail-heading");
    heading.append(element("h1", lane.name), statePill(summary.status));
    const link = t3Link(laneThreadUrl(lane, ctx.agentsById, ctx.hostsById));
    if (link) heading.append(link);
    const agents = [...ctx.agentsById.values()].filter((agent) => agent.laneId === lane.id && agent.id !== manager?.id);
    if (manager) agents.unshift(manager);
    const agentIds = new Set(agents.map((agent) => agent.id));
    const runs = ctx.health.activeRuns.filter((run) => run.laneId === lane.id || agentIds.has(run.agentId));
    return [
      backLink(), heading,
      section("Goal & Weekly Plan", [goalPanel(lane, summary)]),
      section("Waiting on you", decisions.map((item) => decisionRow(item, ctx)), "Nothing waiting on you"),
      section("Policy Alerts", alerts.map((item) => alertRow(item, ctx)), "No active alerts"),
      section("Agents & Runs", [...agents.map((agent) => agentRow(agent, ctx, manager?.id)), ...runs.map((run) => runRow(run, ctx))], "No agents or active runs"),
      section("GitHub PRs", prRows(ctx.prs.filter((pr) => repositoryLane(pr.repository, ctx)?.id === lane.id), viewKey), "No GitHub PRs"),
      section("Open Friction", frictionRows(ctx.friction.filter((item) => item.laneId === lane.id)), "No open friction"),
    ];
  }
  function systemView(ctx) {
    const { health } = ctx;
    return [
      backLink(), element("h1", "System & Details", "detail-heading"),
      section("Waiting on you", ctx.decisions.map((item) => decisionRow(item, ctx)), "Nothing waiting on you"),
      section("Policy Alerts", ctx.alerts.map((item) => alertRow(item, ctx)), "No active alerts"),
      section("Hosts", hostRows(health), "No hosts tracked"),
      section("Active Runs", health.activeRuns.filter((run) => !ctx.stalledIds.has(run.id)).map((run) => runRow(run, ctx)), "No active runs"),
      section("Stalled Runs", health.stalledRuns.map((run) => runRow(run, ctx)), "No stalled runs"),
      section("Open Waits", health.waits.map((wait) => waitRow(wait, ctx)), "No open waits"),
      section("GitHub PRs", prRows(ctx.prs, "system"), "No GitHub PRs"),
      section("Budgets & Spend", [
        spendRow("Team monthly", health.spend),
        ...health.budgets.map((budget) => spendRow(
          `${budget.scopeKind}${budget.scopeId ? " " + budget.scopeId : ""} · ${budget.period} cap USD ${money(budget.capUsd)}${budget.enabled ? "" : " · disabled"}`, budget.spend)),
      ]),
      section("Open Friction", frictionRows(ctx.friction), "No open friction"),
    ];
  }
  function groupByLane(items, laneId) {
    const byLane = new Map();
    for (const item of items) {
      const id = laneId(item);
      if (id == null) continue;
      if (!byLane.has(id)) byLane.set(id, []);
      byLane.get(id).push(item);
    }
    return byLane;
  }
  function context({ digest, health, friction, linkedPrs }) {
    const lanes = [...digest.sections.lanes].sort((a, b) => a.priorityRank - b.priorityRank || a.slug.localeCompare(b.slug));
    const decisions = sortOwnerDecisions(health.pendingOwnerDecisions);
    const prs = githubPrs(health.githubPrs, linkedPrs);
    const draftByPr = new Map(prs.map((pr) => [githubPrKey(pr), pr.isDraft]));
    const alerts = sortAlerts(health.policyAlerts.filter(({ ruleCode, detail }) => {
      if (ruleCode !== "pr_green_ci" && ruleCode !== "two_failure_stop") return true;
      const isDraft = typeof detail?.repository === "string" && Number.isInteger(detail.number)
        ? draftByPr.get(githubPrKey(detail)) : undefined;
      return !(isDraft ?? detail?.isDraft);
    }));
    const ctx = {
      health, friction, lanes, decisions, alerts, prs,
      lanesById: new Map(lanes.map((lane) => [lane.id, lane])),
      lanesBySlug: new Map(lanes.map((lane) => [lane.slug.toLowerCase(), lane])),
      agentsById: new Map(health.agents.map((agent) => [agent.id, agent])),
      hostsById: new Map(health.hosts.map((host) => [host.hostId, host])),
      stalledIds: new Set(health.stalledRuns.map((run) => run.id)),
      decisionsByLane: groupByLane(decisions, (item) => item.laneId),
    };
    ctx.alertsByLane = groupByLane(alerts, (item) => alertLane(item, ctx)?.id);
    return ctx;
  }

  let currentContext;
  function renderView() {
    const route = location.hash.slice(1);
    const system = route === "system";
    byId("owner-digest").hidden = !system;
    if (!currentContext) return;
    const view = byId("view");
    const disclosure = view.querySelector("details[data-pr-key]");
    if (disclosure) prDisclosureOpen.set(disclosure.dataset.prKey, disclosure.open);
    const focusKey = document.activeElement?.dataset.focusKey;
    const slug = /^lane\/(.+)$/.exec(route)?.[1];
    const nodes = system ? systemView(currentContext)
      : slug ? laneView(currentContext.lanes.find((lane) => encodeURIComponent(lane.slug) === slug), currentContext, route)
        : laneBoard(currentContext);
    view.replaceChildren(...nodes);
    if (focusKey) [...view.querySelectorAll("[data-focus-key]")]
      .find((item) => item.dataset.focusKey === focusKey)?.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", () => {
    renderView();
    window.scrollTo(0, 0);
  });

  const themeButtons = [...document.querySelectorAll(".seg button")];
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    for (const button of themeButtons) button.setAttribute("aria-pressed", String(button.dataset.theme === theme));
  }
  try {
    const saved = localStorage.getItem("ostrom-platform-theme");
    if (themeButtons.some((button) => button.dataset.theme === saved)) setTheme(saved);
  } catch {
    // The theme controls still work when storage is blocked.
  }
  for (const button of themeButtons) {
    button.onclick = () => {
      setTheme(button.dataset.theme);
      try { localStorage.setItem("ostrom-platform-theme", button.dataset.theme); } catch {}
    };
  }

  const windowSelect = byId("window");
  const copy = byId("copy-digest");
  let timer;
  let latestRequest = 0;
  let updatedAt;
  let hostCount;
  let live = false;
  function updateLiveStatus() {
    if (live) byId("live").textContent = `Live · ${hostCount} hosts · updated ${relativeTime(updatedAt)}`;
  }
  async function refresh() {
    clearTimeout(timer);
    const requestId = ++latestRequest;
    try {
      const [digest, health, friction, linkedPrs] = await Promise.all([
        read(`/v1/digest?window=${encodeURIComponent(windowSelect.value)}`),
        read("/v1/health/summary"),
        read("/v1/friction?status=open"),
        read("/v1/prs"),
      ]);
      if (requestId !== latestRequest) return;
      currentContext = context({ digest, health, friction, linkedPrs });
      renderView();
      byId("digest").textContent = digest.markdown;
      copy.disabled = false;
      byId("error").hidden = true;
      live = true;
      hostCount = `${health.hosts.filter((host) => host.connectionState === "connected").length}/${health.hosts.length}`;
      updatedAt = new Date().toISOString();
      byId("live-dot").className = "dot dot-ok";
      updateLiveStatus();
    } catch (error) {
      if (requestId !== latestRequest) return;
      const label = byId("error");
      label.textContent = `${updatedAt ? "Stale data" : "Dashboard unavailable"}. ${error.message}`;
      label.hidden = false;
      live = false;
      byId("live").textContent = "Retrying in 5 seconds";
      byId("live-dot").className = "dot dot-warn";
    } finally {
      if (requestId === latestRequest) timer = setTimeout(refresh, 5000);
    }
  }
  windowSelect.onchange = () => {
    if (!token && !proxyAuth) return;
    copy.disabled = true;
    copy.textContent = "Copy Markdown";
    byId("digest").textContent = "Loading digest…";
    void refresh();
  };
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(byId("digest").textContent);
      copy.textContent = "Copied";
    } catch {
      copy.textContent = "Copy failed";
    }
  };
  if (token || proxyAuth) {
    void refresh();
    setInterval(updateLiveStatus, 1000);
  } else {
    byId("error").textContent = "Open the dashboard URL printed by the CLI.";
    byId("error").hidden = false;
    byId("live").textContent = "Dashboard unavailable";
  }
</script>
</body>
</html>
