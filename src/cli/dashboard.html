<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ostrom dashboard</title><style>
:root{font:16px system-ui,sans-serif;color:#17232b;background:#f3f6f5}body{margin:0 auto;max-width:1100px;padding:24px}h1,h2{margin:.4em 0}section{background:white;border:1px solid #d5dfdc;border-radius:8px;padding:16px;margin:14px 0}li{padding:8px 0;border-bottom:1px solid #e6ecea}.error,.stale{color:#9d2c25}a{color:#075a83}pre{white-space:pre-wrap}button{font:inherit}small{color:#53636b}</style></head>
<body><h1>Ostrom</h1><p id="refresh">Connecting…</p><p id="error" class="error"></p><section><h2>Attention</h2><ul id="attention"></ul></section><section><h2>Active tickets</h2><ul id="tickets"></ul></section><section><h2>Recent failures</h2><ul id="failures"></ul></section><section><h2>Ticket detail</h2><div id="detail">Select a ticket.</div></section><section><h2>Recent intake</h2><p>Intake is observed through polling, not a complete GitHub audit.</p><ul id="intake"></ul></section>
<script type="module">
import { ageLabel, attentionItems, createRefresh, githubUrl } from "./dashboard-view.js";
const token=location.hash.slice(1);history.replaceState(null,"",location.pathname+location.search);let selected=null;
const el=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text??"";return n},link=(parent,text,url)=>{const safe=githubUrl(url);if(!safe){parent.append(document.createTextNode(text));return}const a=node("a",text);a.href=safe;a.rel="noopener noreferrer";parent.append(a)};
async function fetchSnapshot(){const headers={Authorization:`Bearer ${token}`};const [status,tickets,intake]=await Promise.all(["/v1/status","/v1/tickets","/v1/intake?limit=50"].map(async p=>{const r=await fetch(p,{headers,cache:"no-store"});if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()}));let detail=null;if(selected){const r=await fetch(`/v1/tickets/${selected}`,{headers,cache:"no-store"});if(!r.ok)throw Error(`/v1/tickets/${selected}: ${r.status}`);detail=await r.json()}return {status,tickets,intake,detail}}
const refresh=createRefresh(fetchSnapshot,(data,at)=>{render(data);el("error").textContent="";el("refresh").textContent=`Last successful refresh: ${at.toLocaleString()}`;el("refresh").className=""},(snapshot,error)=>{if(snapshot)render(snapshot);el("refresh").className="stale";el("error").textContent=`${snapshot?"Snapshot stale. ":""}${error.message}`});
function render(data){const {status,tickets,intake,detail}=data;if(!status.machine)status.machine={temperature:null,slots:{used:0,total:0,meaning:"CPU parallelism"}};el("attention").replaceChildren(...attentionItems(status,tickets).map(x=>{const li=node("li",x.text);if(x.ticketId){const b=node("button","Show ticket");b.onclick=()=>{selected=x.ticketId;void refresh()};li.append(b)}return li}));
el("failures").replaceChildren(...tickets.flatMap(t=>(t.recentFailures??[]).map(f=>{const li=node("li");link(li,`Ticket ${t.id} · ${f.kind}`,t.thread.url);li.append(document.createTextNode(` · ${f.at} · ${f.summary}`));return li})));el("failures").prepend(node("li",`Recent failures · newest 20 · CPU slots: ${status.machine.slots.used}/${status.machine.slots.total} (${status.machine.slots.meaning})`));el("tickets").replaceChildren(...tickets.filter(t=>t.state!=="ended").map(t=>{const li=node("li");link(li,`Ticket ${t.id} · ${t.state}`,t.thread.url);li.append(document.createTextNode(` · ${t.assignment?.harness??"unassigned"} · last completed turn: ${ageLabel(t.assignment?.lastActivityAt)} · budget ${t.budgetUsage.tokens}/${t.budget.tokenLimit}`));for(const pr of t.pullRequests){li.append(document.createTextNode(" · "));link(li,"PR",pr)}if(t.mergeCandidate){li.append(node("p",`Merge policy: ${t.mergeCandidate.policy}${t.mergeCandidate.quietDeadline?` · quiet until ${t.mergeCandidate.quietDeadline}`:""}`))}if(t.mergeCandidate?.blockingReason){li.append(node("p",t.mergeCandidate.blockingReason));if(t.mergeCandidate.blockingReason.includes("approvals"))li.append(node("p","Only submitted reviews count; check GitHub for an unsubmitted draft."))}if(t.latestFailure)li.append(node("p",`Latest failure: ${t.latestFailure.summary}`));const b=node("button","Details");b.onclick=()=>{selected=t.id;void refresh()};li.append(b);return li}));
el("intake").replaceChildren(...intake.map(i=>{const li=node("li");link(li,i.disposition,i.url);li.append(document.createTextNode(` · ${i.observedAt} · ${i.reason??""}`));return li}));if(detail){const d=el("detail");d.replaceChildren(node("p",`Ticket ${detail.id} · ${detail.state} · ${detail.context.reason}`));for(const x of detail.triggers)d.append(node("p",`Trigger ${x.kind}: ${x.url}`));if(detail.mergeCandidate?.blockingReason?.includes("approvals"))d.append(node("p","Only submitted reviews count; check GitHub for an unsubmitted draft."));for(const x of detail.decisions)d.append(node("p",`Decision ${x.verdict}: ${x.reason}`));for(const x of detail.assignments)d.append(node("p",`Assignment ${x.state}: ${x.outcome??""} ${x.outcomeAt??x.endedAt??""} ${x.lastError??x.endReason??""}`));for(const x of detail.outbox)d.append(node("p",`Outbox ${x.kind}: ${x.sentAt??"pending"}`));if(detail.assignment?.sessionId){const id=detail.assignment.sessionId;const p=node("p",`Session ${id} · semon query read_transcript ${id}`);const b=node("button","Copy session ID");b.onclick=()=>navigator.clipboard.writeText(id);p.append(b);d.append(p)}d.append(node("p",`Controls: ostrom pause ${detail.id}, resume ${detail.id}, stop ${detail.id}, extend ${detail.id} --time M`))}}
setInterval(()=>void refresh(),5000);void refresh();
</script></body></html>
