name: Resolve minimum supported Rust version
description: Read the workspace rust-version and normalize it to a toolchain version

outputs:
  declared:
    description: The rust-version declared by the workspace
    value: ${{ steps.resolve.outputs.declared }}
  toolchain:
    description: The declared version normalized to major.minor.patch
    value: ${{ steps.resolve.outputs.toolchain }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      run: |
        declared="$(cargo metadata --no-deps --format-version 1 \
          | jq -r '[.packages[].rust_version] | map(select(. != null)) | unique | .[0]')"
        if [[ ! "$declared" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
          echo "msrv resolver: invalid workspace rust-version '$declared'; expected major.minor or major.minor.patch" >&2
          exit 1
        fi
        if [[ "$declared" == *.*.* ]]; then
          toolchain="$declared"
        else
          toolchain="$declared.0"
        fi
        printf 'declared=%s\ntoolchain=%s\n' "$declared" "$toolchain" >> "$GITHUB_OUTPUT"
