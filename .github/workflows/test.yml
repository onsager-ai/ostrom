name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ostrom-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ostrom/tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/ostrom/tools/package-lock.json
      - name: Require a plugin version change for shipped skill changes
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash plugins/ostrom/tests/check-skill-version-bump.sh "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Run plugin integration tests
        working-directory: .
        run: bash plugins/ostrom/tests/test.sh
      - name: Rebuild committed doctor bundle
        run: |
          npm run build
          git diff --exit-code -- ../dist/doctor.js
