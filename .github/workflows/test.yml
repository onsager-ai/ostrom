name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.85.0 fmt --all --check
      - run: cargo +1.85.0 clippy --all-targets --all-features -- -D warnings
      - run: env -u OSTROM_HOME cargo +1.85.0 build --workspace --all-features
      - run: env -u OSTROM_HOME cargo +1.85.0 test --workspace --all-features

  npm-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 build --locked --package ostrom-cli
      - name: Assert development binary version
        run: |
          target/debug/ostrom --version > target/debug/ostrom-version.txt
          node npm/scripts/assert-version.mjs --version-output target/debug/ostrom-version.txt
      - name: Test offline npm distribution
        run: bash npm/tests/test.sh

  ostrom-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ostrom/tools
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/ostrom/tools/package-lock.json
      - name: Require a plugin version change for shipped skill changes
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash plugins/ostrom/tests/check-skill-version-bump.sh "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Run plugin integration tests
        working-directory: .
        run: bash plugins/ostrom/tests/test.sh
      - name: Rebuild committed doctor bundle
        run: |
          npm run build
          git diff --exit-code -- ../dist/doctor.js
