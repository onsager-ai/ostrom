name: test

on:
  # Default activity types are intentional: the shell-retirement check has no
  # label bypass, so labeled and unlabeled events no longer affect any job.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-toolchain:
    name: Resolve minimum supported Rust version
    runs-on: ubuntu-latest
    outputs:
      declared-msrv: ${{ steps.msrv.outputs.declared }}
      rust-toolchain: ${{ steps.msrv.outputs.toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: msrv
        name: Read rust-version from Cargo.toml
        uses: ./.github/actions/resolve-msrv

  msrv:
    name: Build workspace at declared MSRV
    needs: rust-toolchain
    runs-on: ubuntu-latest
    env:
      DECLARED_MSRV: ${{ needs.rust-toolchain.outputs.declared-msrv }}
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install resolved MSRV toolchain
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal
      - name: Build workspace at declared MSRV
        run: |
          if ! env -u OSTROM_HOME cargo +"$MSRV_TOOLCHAIN" build --workspace --all-features; then
            echo "::error title=MSRV build failed::Workspace does not build at declared minimum Rust $DECLARED_MSRV (resolved toolchain $MSRV_TOOLCHAIN)"
            exit 1
          fi

  rust:
    needs: rust-toolchain
    runs-on: ubuntu-latest
    env:
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - run: cargo +"$MSRV_TOOLCHAIN" fmt --all --check
      - run: cargo +"$MSRV_TOOLCHAIN" clippy --all-targets --all-features -- -D warnings
      - run: env -u OSTROM_HOME cargo +"$MSRV_TOOLCHAIN" test --workspace --all-features

  windows-compile:
    # The release workflow builds five platform targets; this workflow built
    # one. A cfg divergence therefore stayed invisible until a tag was pushed,
    # which is how v0.2.0 failed on Windows after four platforms had already
    # built. Compiling the CLI here makes that class a pull-request failure.
    # Check rather than test: the suite is POSIX-specific by design, and the
    # defect this catches is a compile error.
    needs: rust-toolchain
    runs-on: windows-latest
    env:
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal
      - shell: bash
        run: cargo +"$MSRV_TOOLCHAIN" check --locked --package ostrom-cli

  npm-distribution:
    needs: rust-toolchain
    runs-on: ubuntu-latest
    env:
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal
      - run: cargo +"$MSRV_TOOLCHAIN" build --locked --package ostrom-cli
      - name: Assert development binary version
        run: |
          target/debug/ostrom --version > target/debug/ostrom-version.txt
          node npm/scripts/assert-version.mjs --version-output target/debug/ostrom-version.txt
      - name: Test offline npm distribution
        run: bash npm/tests/test.sh

  # The four jobs below run the imported ethogram tree's own suites.
  #
  # They exist because `exclude = ["ethogram"]` is required for the imported
  # crate to resolve its own workspace values, and its consequence is that the
  # crate is not a workspace member: `cargo test --workspace` runs none of its
  # tests, and `ethogram/.github/workflows/ci.yml` is inert because GitHub runs
  # workflows only from the repository root. Without these jobs the import
  # would silently stop running 186 Rust tests, 162 TypeScript tests, the
  # cross-language conformance suite and the preserve_order probe -- and every
  # other check would stay green while it happened.
  #
  # Counts are asserted, not just exit codes. A suite that stops discovering
  # its tests exits 0.

  ethogram-rust:
    name: ethogram Rust suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test the imported crate
        run: |
          cargo test --manifest-path ethogram/crates/ethogram/Cargo.toml \
            2>&1 | tee ethogram-rust.log
          node .github/scripts/assert-cargo-count.mjs ethogram-rust.log 186

  ethogram-preserve-order-probe:
    name: ethogram under a consumer's preserve_order
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ostrom's own workspace enables serde_json/preserve_order, and Cargo
      # unifies features across a graph. This is the run that proves the
      # imported crate's canonical form does not move under it -- the claim
      # ostrom relies on when it vendors the crate at all.
      - name: Test with the probe feature
        run: |
          cargo test --manifest-path ethogram/crates/ethogram/Cargo.toml \
            --features preserve-order-probe 2>&1 | tee ethogram-probe.log
          node .github/scripts/assert-cargo-count.mjs ethogram-probe.log 186

  ethogram-typescript:
    name: ethogram TypeScript suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ethogram
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          # No `cache: pnpm`, and re-enabling it needs more than adding the
          # line back. setup-node computes the pnpm store path at the
          # repository root -- action post steps ignore
          # `defaults.run.working-directory` -- while the install runs under
          # the imported tree and populates a different store. The post step
          # then fails its own path validation ("Path(s) specified in the
          # action for caching do(es) not exist"), which reds a job whose every
          # real step passed. The install it would have saved takes seconds.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Test
        run: |
          pnpm -r test 2>&1 | tee ../ethogram-ts.log
          node ../.github/scripts/assert-node-test-count.mjs ../ethogram-ts.log 162

  ethogram-conformance:
    name: ethogram cross-language conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          # No `cache: pnpm`, and re-enabling it needs more than adding the
          # line back. setup-node computes the pnpm store path at the
          # repository root -- action post steps ignore
          # `defaults.run.working-directory` -- while the install runs under
          # the imported tree and populates a different store. The post step
          # then fails its own path validation ("Path(s) specified in the
          # action for caching do(es) not exist"), which reds a job whose every
          # real step passed. The install it would have saved takes seconds.
      - name: Install dependencies
        working-directory: ethogram
        run: pnpm install --frozen-lockfile
      # This job is the mechanical proof behind ethogram's first repository
      # principle: the two SDKs are held together by conformance, not by
      # discipline. After the import, this is the only place that runs.
      - name: Compare SDK serialisation
        working-directory: ethogram
        run: |
          ./conformance/run.sh 2>&1 | tee ../conformance.log
          grep -q 'compared 31 fixtures' ../conformance.log
          grep -q 'compared 23 validation error cases' ../conformance.log
          grep -q 'compared 6 agreement inputs' ../conformance.log

  umwelt-rust:
    name: umwelt suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test the imported tree
        run: |
          cargo test --manifest-path umwelt/Cargo.toml --workspace \
            2>&1 | tee umwelt-rust.log
          node .github/scripts/assert-cargo-count.mjs umwelt-rust.log 144

  umwelt-preserve-order-probe:
    name: umwelt under a consumer's preserve_order
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ostrom's workspace enables serde_json/preserve_order and Cargo unifies
      # features across a graph, so this reaches umwelt whether it wants it or
      # not. onsager-ai/umwelt#45 answered that with an explicit recursive key sort; this
      # run is what keeps that sort honest. Without it the trace bytes could
      # move under a consumer's feature and nothing here would notice.
      - name: Test with the probe feature
        run: |
          cargo test --manifest-path umwelt/Cargo.toml --workspace --all-features \
            2>&1 | tee umwelt-probe.log
          node .github/scripts/assert-cargo-count.mjs umwelt-probe.log 145
