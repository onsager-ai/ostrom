name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: env -u OSTROM_HOME cargo build --workspace --all-features
      - run: env -u OSTROM_HOME cargo test --workspace --all-features

  ostrom-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ostrom/tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/ostrom/tools/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Run plugin integration tests
        working-directory: .
        run: bash plugins/ostrom/tests/test.sh
      - name: Rebuild committed doctor bundle
        run: |
          npm run build
          git diff --exit-code -- ../dist/doctor.js
