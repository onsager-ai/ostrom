name: test

on:
  # `labeled` and `unlabeled` are here for the shell freeze. Its failure message
  # tells you to label the pull request `bash-bugfix`, but the check reads
  # `github.event.pull_request.labels` from the event payload — so with the
  # default trigger set a label added after opening is never seen, and re-running
  # the job just replays the stale payload. The advertised escape hatch only
  # worked if you happened to label before opening.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-toolchain:
    name: Resolve minimum supported Rust version
    runs-on: ubuntu-latest
    outputs:
      declared-msrv: ${{ steps.msrv.outputs.declared }}
      rust-toolchain: ${{ steps.msrv.outputs.toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: msrv
        name: Read rust-version from Cargo.toml
        run: bash plugins/ostrom/tests/resolve-msrv.sh Cargo.toml >> "$GITHUB_OUTPUT"

  msrv:
    name: Build workspace at declared MSRV
    needs: rust-toolchain
    runs-on: ubuntu-latest
    env:
      DECLARED_MSRV: ${{ needs.rust-toolchain.outputs.declared-msrv }}
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install resolved MSRV toolchain
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal
      - name: Build workspace at declared MSRV
        run: |
          if ! env -u OSTROM_HOME cargo +"$MSRV_TOOLCHAIN" build --workspace --all-features; then
            echo "::error title=MSRV build failed::Workspace does not build at declared minimum Rust $DECLARED_MSRV (resolved toolchain $MSRV_TOOLCHAIN)"
            exit 1
          fi

  rust:
    needs: rust-toolchain
    runs-on: ubuntu-latest
    env:
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - run: cargo +"$MSRV_TOOLCHAIN" fmt --all --check
      - run: cargo +"$MSRV_TOOLCHAIN" clippy --all-targets --all-features -- -D warnings
      - run: env -u OSTROM_HOME cargo +"$MSRV_TOOLCHAIN" test --workspace --all-features

  windows-compile:
    # The release workflow builds five platform targets; this workflow built
    # one. A cfg divergence therefore stayed invisible until a tag was pushed,
    # which is how v0.2.0 failed on Windows after four platforms had already
    # built. Compiling the CLI here makes that class a pull-request failure.
    # Check rather than test: the suite is POSIX-specific by design, and the
    # defect this catches is a compile error.
    needs: rust-toolchain
    runs-on: windows-latest
    env:
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal
      - shell: bash
        run: cargo +"$MSRV_TOOLCHAIN" check --locked --package ostrom-cli

  npm-distribution:
    needs: rust-toolchain
    runs-on: ubuntu-latest
    env:
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal
      - run: cargo +"$MSRV_TOOLCHAIN" build --locked --package ostrom-cli
      - name: Assert development binary version
        run: |
          target/debug/ostrom --version > target/debug/ostrom-version.txt
          node npm/scripts/assert-version.mjs --version-output target/debug/ostrom-version.txt
      - name: Test offline npm distribution
        run: bash npm/tests/test.sh

  ostrom-tools:
    needs: rust-toolchain
    runs-on: ubuntu-latest
    env:
      MSRV_TOOLCHAIN: ${{ needs.rust-toolchain.outputs.rust-toolchain }}
    defaults:
      run:
        working-directory: plugins/ostrom/tools
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal
        working-directory: .
      - name: Build Ostrom CLI for plugin integration tests
        run: cargo +"$MSRV_TOOLCHAIN" build --locked --package ostrom-cli
        working-directory: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/ostrom/tools/package-lock.json
      - name: Check the plugin CLI floor is published
        working-directory: .
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            node npm/scripts/assert-plugin-cli-floor.mjs --allow-inconclusive
          else
            node npm/scripts/assert-plugin-cli-floor.mjs
          fi
      - name: Require a plugin version change for shipped skill changes
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash plugins/ostrom/tests/check-skill-version-bump.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Prevent shell implementation growth
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          labels_json="$PULL_REQUEST_LABELS"
          PULL_REQUEST_LABELS="$(jq -r '.[]' <<<"$labels_json")"
          export PULL_REQUEST_LABELS
          bash plugins/ostrom/tests/check-shell-freeze.sh "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Run plugin integration tests
        working-directory: .
        run: bash plugins/ostrom/tests/test.sh
      - name: Rebuild committed doctor bundle
        run: |
          npm run build
          git diff --exit-code -- ../dist/doctor.js
