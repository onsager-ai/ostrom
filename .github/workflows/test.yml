name: test

on:
  # `labeled` and `unlabeled` are here for the shell freeze. Its failure message
  # tells you to label the pull request `bash-bugfix`, but the check reads
  # `github.event.pull_request.labels` from the event payload — so with the
  # default trigger set a label added after opening is never seen, and re-running
  # the job just replays the stale payload. The advertised escape hatch only
  # worked if you happened to label before opening.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.86.0 fmt --all --check
      - run: cargo +1.86.0 clippy --all-targets --all-features -- -D warnings
      - run: env -u OSTROM_HOME cargo +1.86.0 build --workspace --all-features
      - run: env -u OSTROM_HOME cargo +1.86.0 test --workspace --all-features

  windows-compile:
    # The release workflow builds five platform targets; this workflow built
    # one. A cfg divergence therefore stayed invisible until a tag was pushed,
    # which is how v0.2.0 failed on Windows after four platforms had already
    # built. Compiling the CLI here makes that class a pull-request failure.
    # Check rather than test: the suite is POSIX-specific by design, and the
    # defect this catches is a compile error.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal
      - run: cargo +1.86.0 check --locked --package ostrom-cli

  npm-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal
      - run: cargo +1.86.0 build --locked --package ostrom-cli
      - name: Assert development binary version
        run: |
          target/debug/ostrom --version > target/debug/ostrom-version.txt
          node npm/scripts/assert-version.mjs --version-output target/debug/ostrom-version.txt
      - name: Test offline npm distribution
        run: bash npm/tests/test.sh

  ostrom-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ostrom/tools
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal
        working-directory: .
      - name: Build Ostrom CLI for plugin integration tests
        run: cargo +1.86.0 build --locked --package ostrom-cli
        working-directory: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/ostrom/tools/package-lock.json
      - name: Require a plugin version change for shipped skill changes
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash plugins/ostrom/tests/check-skill-version-bump.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Prevent shell implementation growth
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          labels_json="$PULL_REQUEST_LABELS"
          PULL_REQUEST_LABELS="$(jq -r '.[]' <<<"$labels_json")"
          export PULL_REQUEST_LABELS
          bash plugins/ostrom/tests/check-shell-freeze.sh "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Run plugin integration tests
        working-directory: .
        run: bash plugins/ostrom/tests/test.sh
      - name: Rebuild committed doctor bundle
        run: |
          npm run build
          git diff --exit-code -- ../dist/doctor.js
