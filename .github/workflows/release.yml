name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to rebuild and (re)publish, e.g. v0.14.0. Leave empty to build
          and pack without publishing, as a plain dispatch always has.
        required: false
        type: string

permissions:
  contents: read

jobs:
  meta:
    name: Resolve version and build matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is-release: ${{ steps.meta.outputs.is-release }}
      rebuild-of-tag: ${{ steps.meta.outputs.rebuild-of-tag }}
      npm-tag: ${{ steps.meta.outputs.npm-tag }}
      matrix: ${{ steps.meta.outputs.matrix }}
      verification-dir: ${{ steps.meta.outputs.verification-dir }}
      verification-binaries: ${{ steps.meta.outputs.verification-binaries }}
      main-dir: ${{ steps.meta.outputs.main-dir }}
      declared-msrv: ${{ steps.msrv.outputs.declared }}
      rust-toolchain: ${{ steps.msrv.outputs.toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - id: msrv
        name: Read rust-version from Cargo.toml
        uses: ./.github/actions/resolve-msrv
      - id: meta
        name: Read npm release configuration
        env:
          RELEASE_DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: node npm/scripts/release-meta.mjs
      - name: Refuse a dispatch this tag cannot publish
        # On a dispatch every job runs the tag's own scripts, but this workflow
        # file comes from the dispatching ref. A tag cut before dispatch
        # recovery existed has a release-meta.mjs that ignores the tag input and
        # reports is-release=false, so every publish step would be skipped and
        # the run would end green with nothing published. The refusal lives
        # here because only this file is guaranteed to be new enough to make it.
        if: github.event.inputs.tag != '' && steps.meta.outputs.rebuild-of-tag != 'true'
        env:
          RELEASE_DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "::error::tag ${RELEASE_DISPATCH_TAG} predates dispatch recovery; this workflow cannot publish it"
          exit 1

  build:
    name: Build ${{ matrix.platform }}
    needs: meta
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      MSRV_TOOLCHAIN: ${{ needs.meta.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - name: Install pinned Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Build release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +"$MSRV_TOOLCHAIN" build --locked --release --package ostrom-cli --target "$TARGET"
      - name: Assert binary version
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARIES: ${{ matrix.binaries }}
          EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          IFS=',' read -ra names <<< "$BINARIES"
          for name in "${names[@]}"; do
            "target/$TARGET/release/$name" --version > binary-version.txt
            node npm/scripts/assert-version.mjs \
              --version-output binary-version.txt \
              --expected "$EXPECTED_VERSION"
          done
      - name: Upload release binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ matrix.artifactPaths }}
          if-no-files-found: error
          retention-days: 1

  package-and-publish:
    name: Pack and publish npm distribution
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - name: Set up Node.js for npm provenance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: artifacts
      - name: Stage platform and launcher packages
        # GITHUB_SHA is the tag commit on a tag push, but on a dispatch it is
        # the dispatching ref's commit, not the `ref: <tag>` this job just
        # checked out — pass the commit actually on disk explicitly instead
        # of letting stage-packages.mjs fall back to GITHUB_SHA.
        run: >-
          node npm/scripts/stage-packages.mjs
          --artifacts artifacts
          --version "${{ needs.meta.outputs.version }}"
          --git-head "$(git rev-parse HEAD)"
      - name: Verify package and binary versions
        env:
          BINARIES: ${{ needs.meta.outputs.verification-binaries }}
          PLATFORM_DIR: ${{ needs.meta.outputs.verification-dir }}
          MAIN_DIR: ${{ needs.meta.outputs.main-dir }}
        run: |
          IFS=',' read -ra names <<< "$BINARIES"
          for name in "${names[@]}"; do
            "target/npm-packages/$PLATFORM_DIR/$name" --version > "target/npm-packages/$name-version.txt"
            node npm/scripts/assert-version.mjs \
              --version-output "target/npm-packages/$name-version.txt" \
              --package "target/npm-packages/$MAIN_DIR/package.json"
          done
          node npm/scripts/verify-packages.mjs
      - name: Pack all six packages
        run: bash npm/scripts/pack.sh
      - name: Publish platform packages with provenance
        if: needs.meta.outputs.is-release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          node npm/scripts/publish.mjs
          --target platforms
          --tag "${{ needs.meta.outputs.npm-tag }}"
          ${{ needs.meta.outputs.rebuild-of-tag == 'true' && '--rebuild-of-tag' || '' }}
      - name: Wait for platform package propagation
        if: needs.meta.outputs.is-release == 'true'
        run: >-
          node npm/scripts/wait-for-platforms.mjs
          --version "${{ needs.meta.outputs.version }}"
          ${{ needs.meta.outputs.rebuild-of-tag == 'true' && '--rebuild-of-tag' || '' }}
      - name: Publish launcher package with provenance
        if: needs.meta.outputs.is-release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          node npm/scripts/publish.mjs
          --target main
          --tag "${{ needs.meta.outputs.npm-tag }}"
          ${{ needs.meta.outputs.rebuild-of-tag == 'true' && '--rebuild-of-tag' || '' }}
