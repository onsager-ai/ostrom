# ostrom — touch-log config (reference example)
#
# Copy the parts you want into ~/.claude/ostrom/config.yaml and edit.
# This is the SHAREABLE layer: NO secrets. If a provider ever needs a
# token, it goes in ~/.claude/ostrom/secrets.yaml (machine-local), never here.

# ---- Example A: zero-account default (offline; git-commons opt-in) ----
provider: file
buckets: [freezable, unverified, personal]
file:
  path: ~/.claude/ostrom/touch-log.md
  auto_commit: false          # true + a git-repo path => each touch is a commit

# ---- Example B: Notion ----
# provider: notion
# buckets: [可冻结, 需验证, 真我]        # freezable / unverified / personal
# notion:
#   data_source: collection://xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#   properties:                 # normalized field -> your Notion property name
#     judgment: Judgment         # title
#     date:     Date             # date (start = today)
#     system:   System           # select: claude-code-cloud / claude-code-local
#     bucket:   Bucket           # select
#     minutes:  Minutes          # number
#     flags:    Flags            # optional: multi-select / text (⚑ overrides, ...)

# ---- Repo / org layering ----
# Commit non-secret overrides to ./.ostrom/config.yaml in a project.
# Inherit an org constitution with:
# extends: https://raw.githubusercontent.com/<org>/<repo>/main/.ostrom/config.yaml
