# Copy this file to ~/.claude/ostrom/mandates.yaml and replace every
# placeholder. Never commit the resulting private roster.
#
# Layers resolve shipped defaults < user file < ./.ostrom/mandates.yaml.
# Lists in a more-specific layer replace the corresponding earlier list.

provider: file
cadence_hours: 1
stuck_after_days: 7

# Directories to search recursively for local Git repositories. Every linked
# worktree belonging to a discovered repository is scanned too.
search_roots:
  - /path/to/repositories

bounce_all:
  - title:*merge to main*
  - title:*production deployment*
  - title:*external publication*
  - title:*credential*

projects:
  - repo: example-org/example-repo
    # This prevents branch collisions within this repository; omit it for 1.
    # Global shared-compute capacity is configured separately by dispatch.
    max_implementers_per_repository: 1
    # Selectors are case-insensitive. Supported prefixes are label, scope,
    # type, path, ref, and title. Only * is a wildcard; path ** spans depth.
    delegated:
      - label:maintenance
      - scope:tooling
      - path:docs/**
    excluded:
      - label:wontfix
    # Reserved refs are exact item or closing-issue numbers.
    reserved:
      - 42
    # Unmatched items roll up for triage instead of flooding the queue.
    default: unclassified
    paused: false
    bounce:
      - label:public-release
      - title:*breaking API*
  - repo: example-org/another-repo
    delegated:
      - type:ci
      - scope:release
    excluded: []
    reserved: []
    default: excluded
    # Paused projects still evaluate reserved refs, tripwires, and CI drift.
    paused: true
    bounce:
      - path:.github/workflows/**
