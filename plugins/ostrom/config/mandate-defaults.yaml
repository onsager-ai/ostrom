# ostrom — mandate config (shipped defaults)
#
# Layered, most-specific wins:
#   these defaults  <  ~/.claude/ostrom/mandates.yaml (user)
#                   <  ./.ostrom/mandates.yaml (repo)
#
# Mandate content is private. This file ships mechanism defaults only; put
# the real roster and its boundaries in the user layer. The parser supports
# this intentionally small schema: root scalars, bounce_all, and projects
# containing selector lists, default and paused scalars, and an optional
# per-repository implementer collision cap.

provider: file
cadence_hours: 1
stuck_after_days: 7

# Local repository discovery is opt-in. Never guess paths on the principal's
# machine; a more-specific layer must replace this empty list explicitly.
search_roots: []

# Shared write-surface tripwires. Selectors are case-insensitive qualified
# globs. A more-specific layer may replace this list.
bounce_all:
  - title:*merge to main*
  - title:*production deployment*
  - title:*external publication*
  - title:*credential*

projects: []
