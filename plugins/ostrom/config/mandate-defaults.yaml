# ostrom — mandate config (shipped defaults)
#
# Layered, most-specific wins:
#   these defaults  <  ~/.claude/ostrom/mandates.yaml (user)
#                   <  ./.ostrom/mandates.yaml (repo)
#
# Mandate content is private. This file ships mechanism defaults only; put
# the real roster and its boundaries in the user layer. The parser supports
# this intentionally small schema: root scalars, bounce_all, hold_labels,
# work_ranking, search_roots, and projects containing selector lists, default
# and paused scalars, and an optional per-repository implementer collision cap.

provider: file
cadence_hours: 1
stuck_after_days: 7

# Dispatch scans these parent directories for a git checkout whose origin
# matches each work order's repository. Dispatch cannot function until at
# least one root is configured; never guess paths on the principal's machine.
search_roots: []

# Label globs that mechanically park otherwise delegated items. Matching is
# case-insensitive and uses the same * wildcard as label: selectors.
hold_labels: []

# Principal-authored ordering over already-dispatchable delegated work. Entries
# are canonical owner/repository#number item IDs in highest-first order. This
# cannot widen a mandate or cross a hold; an empty list preserves oldest-first.
work_ranking: []

# Shared write-surface tripwires. Selectors are case-insensitive qualified
# globs. Risk labels name why a change needs judgment; content paths cover
# mechanically observable secret surfaces. A more-specific layer may replace
# this list.
bounce_all:
  - label:risk:secret
  - label:risk:announce
  - label:risk:hosting
  - path:**/.env
  - path:**/.env.local
  - path:**/.env.production
  - path:**/secrets/**

projects: []
