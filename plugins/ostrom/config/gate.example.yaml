# Copy this file to ~/.claude/ostrom/gate.yaml and replace every placeholder.
# Neither the builder nor the gatekeeper may write the installed file.
#
# Layers resolve shipped defaults < user file < ./.ostrom/gate.yaml.
# Lists in a more-specific layer replace the corresponding earlier list.
#
# Bounce selectors use the mandate vocabulary exactly: label, type, path, and
# ref. Matching is case-insensitive; * is a wildcard and path ** spans depth.
# path: and ref: are content-derived. type: and label: are author-written and
# therefore best-effort gates.

provider: file

bounce_all:
  - path:<shared-content-path-glob>

projects:
  - repo: <owner>/<repo>
    # Required-check entries are case-insensitive check-name globs.
    required_checks:
      - <check-name-glob>
    bounce:
      - path:<content-path-glob>
      - label:risk:<why-this-needs-judgment>
    # Reserved refs are exact PR or closing-issue numbers.
    reserved:
      - <positive-integer>
