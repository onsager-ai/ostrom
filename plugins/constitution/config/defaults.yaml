# ostrom — touch-log config (shipped defaults)
#
# Layered, most-specific wins:
#   these defaults  <  ~/.claude/ostrom/config.yaml (user)
#                   <  ./.ostrom/config.yaml (repo)
#                   <  whatever `extends:` points at (org)
#
# The split is secret-vs-shareable, NOT in-repo-vs-out. Everything here is
# shareable. Secrets (tokens) go ONLY in ~/.claude/ostrom/secrets.yaml —
# machine-local, never committed. The `file` default needs no secret at all.

provider: file              # file | notion

# The bucket vocabulary — the ONE field the agent asks you for and never
# self-assigns. Ships as English slots; override with your own words.
buckets:
  - freezable               # stable/general enough to become a frozen rule
  - unverified              # maybe a pattern; must recur before it earns a rule
  - personal                # personal taste/identity; never generalizes

file:
  path: ~/.claude/ostrom/touch-log.md
  auto_commit: false        # true + a git-repo path => one commit per touch

# notion:                   # used only when provider: notion
#   see config.example.yaml
