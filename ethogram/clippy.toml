# This file is intentionally empty of keys. Its only job is to exist.
#
# `ethogram/` is a subtree imported from its own repository, and this tree is
# linted under the configuration that repository had: whatever `cargo clippy`
# finds at `-D warnings` with no extra `disallowed-*` rules. Clippy resolves
# `clippy.toml` by walking up from the linted crate to the nearest one it
# finds; without a file here, that walk would not stop at this tree's own
# root, it would continue up to ostrom's, and ostrom's root `clippy.toml`
# would silently start applying to vendored code that never agreed to it.
#
# ostrom's root file bans `chrono::Utc::now` (production time must come from
# an injected `ostrom_store::clock::Clock`, established by #385) and the types
# `std::path::Path`, `std::path::PathBuf` and `std::io::Error`. Those are
# ostrom's own conventions, not ethogram's — ethogram's own build script
# resolves `CARGO_MANIFEST_DIR` and `OUT_DIR` through `PathBuf` because that
# is what a Cargo build script is handed. Making this tree satisfy ostrom's
# rules would be a scope increase, not fold parity: the gate being restored
# here is the one ethogram's own CI used to run, and that gate never included
# these.
