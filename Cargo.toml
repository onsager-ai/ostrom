[workspace]
members = [
    "crates/ostrom-cli",
    "crates/ostrom-core",
    "crates/ostrom-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/onsager-ai/ostrom"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.45", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["preserve_order"] }
serde_yaml = "0.9.34"
tempfile = "3.20.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
