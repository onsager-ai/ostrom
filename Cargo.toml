[workspace]
members = ["crates/umwelt-capture", "crates/umwelt-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/onsager-ai/umwelt"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
ethogram = { git = "https://github.com/onsager-ai/ethogram", rev = "26152cebeff4b71c33f855c4de548244f11c21fe" }
ethogram-corpus = { git = "https://github.com/onsager-ai/ethogram", rev = "26152cebeff4b71c33f855c4de548244f11c21fe" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_types = "allow"
disallowed_methods = "deny"
