[workspace]
members = [
    "crates/ostrom-checks",
    "crates/ostrom-cli",
    "crates/ostrom-core",
    "crates/ostrom-store",
]
resolver = "2"

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/onsager-ai/ostrom"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "=0.4.44", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.5.45", features = ["derive"] }
base64 = "=0.22.1"
directories = "6.0.0"
ethogram = { git = "https://github.com/onsager-ai/ethogram", rev = "ba892e843db9df7cbc74bd52e2933799fa8cd3d9" }
indexmap = "2"
regex = "=1.12.3"
rsa = { version = "=0.9.8", features = ["sha2"] }
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
signal-hook = { version = "=0.3.18", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
serde_yaml = "0.9.34"
tempfile = "3.20.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
umwelt-capture = { git = "https://github.com/onsager-ai/umwelt.git", rev = "fdfc928a3a80001b5c98d748349fcfcb48aace80" }
umwelt-runtime = { git = "https://github.com/onsager-ai/umwelt.git", rev = "fdfc928a3a80001b5c98d748349fcfcb48aace80" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_types = "allow"
disallowed_methods = "deny"
