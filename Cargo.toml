[workspace]
members = ["crates/umwelt-capture", "crates/umwelt-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/onsager-ai/umwelt"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
ethogram = { git = "https://github.com/onsager-ai/ethogram", rev = "ba892e843db9df7cbc74bd52e2933799fa8cd3d9" }
ethogram-corpus = { git = "https://github.com/onsager-ai/ethogram", rev = "ba892e843db9df7cbc74bd52e2933799fa8cd3d9" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_types = "allow"
disallowed_methods = "deny"
