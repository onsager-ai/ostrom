[workspace]
members = [
    "crates/ostrom-checks",
    "crates/ostrom-cli",
    "crates/ostrom-core",
    "crates/ostrom-store",
]
# Both imported trees carry their own [workspace]. Without this exclude Cargo
# binds their crates to ostrom's workspace instead, so `version.workspace` and
# `serde_json.workspace` resolve against ostrom.
#
# The two fail differently, which is why neither can be dropped on the
# strength of the other. ethogram fails **silently**: the crate reports
# ostrom's version and loses serde_json's `float_roundtrip`, which its own
# manifest calls REQUIRED, and a captured `costUsd` is then re-emitted as a
# different number with no error. umwelt fails **loudly**, at manifest load.
exclude = ["ethogram", "umwelt"]
resolver = "2"

[workspace.package]
version = "0.13.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/onsager-ai/ostrom"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "=0.4.44", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.5.45", features = ["derive"] }
base64 = "=0.22.1"
directories = "6.0.0"
ethogram = { path = "ethogram/crates/ethogram" }
indexmap = "2"
regex = "=1.12.3"
rsa = { version = "=0.9.8", features = ["sha2"] }
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
signal-hook = { version = "=0.3.18", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
serde_yaml = "0.9.34"
tempfile = "3.20.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
umwelt-capture = { path = "umwelt/crates/umwelt-capture" }
umwelt-runtime = { path = "umwelt/crates/umwelt-runtime" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_types = "allow"
disallowed_methods = "deny"

# umwelt depends on ethogram by git rev. With ostrom's own dependency moved to
# the vendored path, those are two distinct copies of one crate and every type
# crossing the boundary stops unifying -- 27 compile errors of the form
# "expected ethogram::Event, found ethogram::Event". The patch redirects the
# git source to the vendored tree so there is exactly one ethogram in the
# graph. It is removed when umwelt is folded and stops being a git dependency.
[patch."https://github.com/onsager-ai/ethogram"]
ethogram = { path = "ethogram/crates/ethogram" }
